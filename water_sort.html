<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">개미군단 - 과일주스 V12 Solver Fix</title>
<style>
/* === 다크 테마 CSS 스펙 === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06110c;--bg-soft:#0d1d16;--card:#0f221b;--card2:#152b21;
  --text:#e4ede7;--muted:#8ea89b;--dim:#5e786a;--line:#214032;
  --line-strong:#39614c;--accent:#f3ca65;--orange:#e67e22;
  --selected-bottle:#4da6ff;
  --unknown-color: #583122; 
}
html,body{min-height:100%;background:radial-gradient(circle at 50% 30%, #11261d 0%, #050e0a 100%);color:var(--text)}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  line-height:1.5;overflow-x:hidden;
}
button,input{font:inherit}

.site-navbar{
  position:sticky;top:0;z-index:20;background:#0c1c15f0;
  border-bottom:1px solid #214233;backdrop-filter:blur(14px);
}
.site-nav-inner{
  width:min(1200px,100%);margin:auto;min-height:58px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.site-nav-brand-link{display:flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;flex-shrink:0}
.site-nav-title{font-size:15px;font-weight:700;letter-spacing:.02em;color:#f3ca65;white-space:nowrap}
.site-nav-subtitle{font-size:9px;color:var(--muted);display:block;line-height:1}
.site-nav-links{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.site-nav-link{
  color:#d0e3d7;text-decoration:none;border:0;background:transparent;
  padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap;
}
.site-nav-link:hover{background:#ffffff0f}
.site-nav-link.active{color:var(--accent);background:#ffffff0a}

.container{width:min(1200px,100%);margin:auto;padding:18px 16px 35px}

.scale-controls{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;
}
.scale-btn{
  background:#12261e;color:#8ea89b;border:1px solid #214032;
  padding:4px 12px;font-size:12px;border-radius:12px;cursor:pointer;
  transition:all 0.15s ease;
}
.scale-btn:hover{background:#1d3d2e;color:#ffe9a9}
.scale-btn.active{background:#284c3a;color:#f3ca65;border-color:#3d7e56;font-weight:700}

#zoom-wrapper{
  width:100%;
  transform-origin: top center;
  transition: transform 0.2s ease;
}

.card{
  width:min(900px,100%); margin:auto;background:var(--card);
  border:1px solid #2a4c3b;border-radius:20px;padding:20px;
  box-shadow:0 10px 40px #000b, inset 0 0 15px rgba(0,0,0,0.6);
}

.section-title {
  text-align: center; color: var(--accent); font-size: 20px; font-weight: 700;
  margin-bottom: 15px; text-shadow: 0 0 10px rgba(243,202,101,0.3);
}

/* 이미지 업로드 영역 */
.upload-card-section {
  background: var(--card2);
  border: 1px dashed var(--accent);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 15px;
  text-align: center;
}
.upload-btn {
  display: inline-block;
  background: linear-gradient(180deg, #e67e22 0%, #a0500a 100%);
  color: #fff;
  padding: 8px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  border: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.1s ease;
}
.upload-btn:hover { transform: scale(1.03); }

/* 상단 팔레트 */
.palette-card-section {
  background: var(--card2);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}

.instruction-text {
  text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px;
}
.instruction-text b { color: var(--accent); }

.color-palette {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
}

.color-swatch-wrapper {
  position: relative; width: 38px; height: 38px;
}


.color-swatch {
  width: 100%; height: 100%; border-radius: 8px;
  border: 2px solid #1a3328; cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

.color-swatch.dark-text { color: #000; text-shadow: none; }
.color-swatch:hover { transform: scale(1.15); border-color: var(--accent); }
.color-swatch.selected-color {
  border-color: #ff3366 !important;
  box-shadow: 0 0 12px #ff3366;
  transform: scale(1.1);
}

.color-swatch.eraser {
  background: #173024; color: #ff5555; font-size: 18px; border: 2px dashed #39614c;
}

.color-swatch.unknown {
  background: var(--unknown-color); 
  color: #fff; font-size: 18px; border: 2px solid #8ea89b;
}

.custom-color-box {
  display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.custom-color-box input {
  background: #091510; border: 1px solid var(--line-strong); color: #fff;
  padding: 5px 10px; border-radius: 8px; width: 100px; text-align: center;
  font-family: monospace; text-transform: uppercase; font-size: 13px;
}
.btn-sm {
  background: #1f482f; color: var(--text); border: 1px solid var(--line-strong);
  padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.btn-sm:hover { background: #28573a; color: var(--accent); }
.btn-del {
  background: #4d1f27; color: #ffb3c1; border-color: #802f3e;
}
.btn-del:hover { background: #6b2635; color: #fff; }

/* 하단 Bottle 컨테이너 */
.bottles-container {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr)); 
  gap: 12px; justify-items: center; margin-bottom: 20px; padding: 15px 10px;
  background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--line);
}

@media (max-width: 1000px) {
  .bottles-container { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px 5px; }
  .bottle { max-width: 100%; height: 130px; border-radius: 0 0 12px 12px; border-width: 2px; }
  .bottle-wrapper { gap: 4px; }
  .bottle-num { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
}
@media (max-width: 480px) {
    .container { padding: 10px 8px; }
    .card { padding: 15px 10px; border-radius: 16px; }
    .bottles-container { gap: 5px; }
    .bottle { height: 110px; }
}

.bottle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%;}
.bottle-num { font-size: 12px; color: var(--dim); font-weight: bold; }

.bottle {
  width: 100%; max-width: 48px; height: 160px;
  background: rgba(10, 23, 17, 0.8);
  border: 3px solid #3d7e56; border-top: 1px solid #3d7e56;
  border-radius: 0 0 16px 16px;
  display: flex; flex-direction: column-reverse;
  overflow: hidden; cursor: pointer; position: relative;
  box-shadow: inset 0 0 10px #000, 0 4px 12px rgba(0,0,0,0.5);
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.bottle:hover { border-color: var(--dim); }

.bottle.selected {
  border-color: var(--selected-bottle) !important;
  box-shadow: 0 0 20px rgba(77, 166, 255, 0.7), inset 0 0 8px rgba(77, 166, 255, 0.4);
  transform: translateY(-5px); z-index: 1;
}
.bottle.selected::before {
  content: '▼'; position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
  color: var(--selected-bottle); font-size: 16px; font-weight: bold;
}

.segment {
  width: 100%; height: 25%;
  border-top: 1px dashed rgba(255,255,255,0.1);
  box-sizing: border-box; transition: background-color 0.1s ease;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: rgba(255,255,255,0.7);
}

/* 일반 버튼 스타일 (원래대로 복원) */
.controls-row {
  display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
}
.action-btn {
  background: linear-gradient(180deg, #3d7e56 0%, #1f482f 100%);
  color: #ffe9a9; border: 1px solid #6cb885; padding: .6rem 1.2rem;
  font-size: 0.95rem; border-radius: 18px; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8); transition: all 0.15s ease;
}
.action-btn:hover { background: linear-gradient(180deg, #479265 0%, #265739 100%); border-color: #81cb9a; }
.action-btn:disabled {
  background: #152820; color: #4a6657; border-color: #1c3629; cursor: not-allowed;
  box-shadow: none; text-shadow: none; transform: none !important;
}

.btn-red { background: linear-gradient(180deg, #9e3939 0%, #612525 100%); border-color: #d47373; color: #ffdddd; }
.btn-red:hover { background: linear-gradient(180deg, #b84747 0%, #7a2d2d 100%); }

.btn-orange { background: linear-gradient(180deg, #b87a39 0%, #6b431e 100%); border-color: #d4a373; color: #ffebd0; }
.btn-orange:hover { background: linear-gradient(180deg, #cc8b45 0%, #805124 100%); }

/* '배치 정답 구하기' 버튼만 게임 스타일 및 강조 유지 */
.btn-solve-highlight {
  background: linear-gradient(to bottom, #fce074 0%, #e89823 50%, #c46a06 51%, #df8f15 100%) !important;
  color: #ffffff !important;
  border: 1px solid #ffe89e !important;
  border-radius: 12px 0px 12px 0px !important;
  font-size: 1.1rem !important;
  padding: 0.7rem 1.5rem !important;
  box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.6) !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6) !important;
}
.btn-solve-highlight:hover { filter: brightness(1.1); }
.btn-solve-highlight:active { transform: scale(0.97); }

.bottle-count-badge { font-size: 14px; color: var(--accent); font-weight: bold; margin: 0 5px; }

/* 결과창 컨테이너 */
.solution-container {
    display: none;
    margin-top: 20px; 
    background: #091510;
    border: 2px solid var(--line-strong); 
    border-radius: 16px;
    overflow: hidden; 
    box-shadow: 0 10px 30px #000;
}

.tab-control-bar {
    display: flex; 
    background: #12261e; 
    border-bottom: 2px solid var(--line-strong);
}
.tab-btn {
    flex: 1; padding: 12px 0; background: none; border: none;
    color: var(--dim); font-weight: 700; font-size: 14px; cursor: pointer;
    transition: all 0.15s ease; text-align: center; position: relative;
}
.tab-btn:hover { color: var(--accent); background: #ffffff05; }
.tab-btn.active { color: var(--accent); background: #ffffff0a; }
.tab-btn.active::after {
    content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 3px; background: var(--accent); border-radius: 3px 3px 0 0;
}

.solution-content-area { padding: 20px; }

.result-text-panel {
  max-height: none;
  overflow-y: visible;
  display: none;
}
.step-item {
  padding: 12px 15px; border-bottom: 1px solid #173024;
  display: flex; align-items: center; gap: 12px;
  font-size: 1.15rem; font-weight: 600; color: #fff;
}
.step-item:last-child { border-bottom: none; }
.step-num { color: var(--accent); font-weight: 800; min-width: 30px; text-align: right; }
.pour-arrow { color: var(--muted); font-weight: 400; margin: 0 4px; }
.color-dot {
    display: inline-block;
    width: 22px; height: 22px; border-radius: 4px; 
    border: 1px solid rgba(255,255,255,0.4);
    margin-left: auto;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.result-image-panel { 
  display: block; 
  text-align: center; 
  overflow-x: hidden;
  padding: 0;
  width: 100%;
}
#solution-canvas {
    max-width: 100%;
    height: auto;
    background: #091510;
    box-shadow: none;
    border: none;
    border-radius: 8px;
    display: block; 
    margin: 0 auto;
}

.lang-switch {
  background: #12261e; color: var(--accent); border: 1px solid #214032;
  padding: 5px 8px; font-size: 11px; border-radius: 8px; cursor: pointer;
  font-weight: 700; transition: all 0.15s ease; white-space: nowrap;
}
.lang-switch:hover { background: #1d3d2e; }

@media (max-width: 768px) {
    .solution-content-area { padding: 10px; }
}

/* === 풀이 이미지 단계별 애니메이션 컨트롤 === */
#solution-animation-controls {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:14px 10px 18px;
    background:#12261e;
    border-top:1px solid #214032;
}
.solution-nav-btn {
    min-width:100px;
    padding:10px 18px;
    border-radius:12px;
    border:1px solid #6cb885;
    background:linear-gradient(180deg,#3d7e56 0%,#1f482f 100%);
    color:#ffe9a9;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease,filter .15s ease;
}
.solution-nav-btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.solution-nav-btn:active:not(:disabled){transform:scale(.96)}
.solution-nav-btn:disabled{opacity:.35;cursor:not-allowed}
#solution-step-indicator{min-width:76px;text-align:center;color:#f3ca65;font-size:16px;font-weight:800}
@media(max-width:480px){
  #solution-animation-controls{gap:8px}
  .solution-nav-btn{min-width:82px;padding:9px 10px;font-size:14px}
  #solution-step-indicator{min-width:60px;font-size:14px}
}

.solution-auto-btn.solution-auto-active {
    background: linear-gradient(180deg, #9a4b4b 0%, #5b2626 100%);
    border-color: #e07a7a;
    color: #fff;
}

.solution-speed-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #f3ca65;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
}

.solution-speed-wrap select {
    min-width: 78px;
    padding: 9px 8px;
    border-radius: 10px;
    border: 1px solid #6cb885;
    background: #10271c;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    outline: none;
}

.solution-speed-wrap select:focus {
    border-color: #f3ca65;
}

@media (max-width: 480px) {
    .solution-speed-wrap {
        gap: 4px;
        font-size: 12px;
    }

    .solution-speed-wrap select {
        min-width: 70px;
        padding: 8px 5px;
        font-size: 12px;
    }
}
</style>
</head>
<body>

<nav class="site-navbar">
  <div class="site-nav-inner">
    <a href="#" class="site-nav-brand-link" onclick="resetAll(); return false;">
      <span>
        <span class="site-nav-title" data-i18n="navTitle">개미군단 과일주스</span>
        <span class="site-nav-subtitle">S454 [101]마요 ₍ᵔ.ˬ.ᵔ₎</span>
      </span>
    </a>

    <div class="site-nav-links">
      <a href="https://sualocin.github.io/ant/" class="site-nav-link" data-i18n="navNemo">개미족의 지혜 네모</a>
      <a href="#" class="site-nav-link" onclick="resetAll(); return false;" data-i18n="navReset">초기화</a>
      <button type="button" class="lang-switch" onclick="toggleLanguage()">🇰🇷 / 🇺🇸</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="scale-controls">
    <button type="button" class="scale-btn" onclick="setScale(0.85, this)">85%</button>
    <button type="button" class="scale-btn active" onclick="setScale(1, this)">100%</button>
    <button type="button" class="scale-btn" onclick="setScale(1.15, this)">115%</button>
  </div>

  <div id="zoom-wrapper">
    <div class="card">
      <!-- 이미지 업로드 영역 -->
      <div class="upload-card-section">
        <button type="button" class="upload-btn" onclick="triggerFileUpload()" data-i18n="uploadBtn">
          📷 게임 스크린샷 앨범에서 선택하여 자동 인식
        </button>
        <input type="file" id="image-input" accept="image/*" onchange="processUploadedImage(event)" style="display:none;">
        <div style="font-size: 11px; color: var(--muted); margin-top: 6px;" data-i18n="uploadDesc">
          스크린샷을 선택하면 빈 병 수와 색상('?' 포함)을 자동으로 추출합니다. <br>
        </div>
      </div>

      <!-- 상단 팔레트 -->
      <div class="palette-card-section">
        <div class="instruction-text" id="instruction-text">
          <b>단계 1:</b> 아래 그리드에서 <b style="color:var(--selected-bottle);">입력할 빈 병을 먼저 클릭</b>하세요.
        </div>

        <div class="color-palette" id="palette"></div>

        <div class="custom-color-box">
          <input type="text" id="custom-hex" placeholder="HEX 코드" maxlength="6">
          <button class="btn-sm" onclick="addCustomColor()" data-i18n="btnAddColor">+ 색상 추가</button>
          <button class="btn-sm btn-del" onclick="deleteSelectedPaletteColor()" data-i18n="btnDelColor">- 색상 삭제</button>
        </div>
      </div>

      <!-- 하단 Bottle 그리드 -->
      <div class="bottles-container" id="bottles-container"></div>

      <!-- 컨트롤 버튼 -->
      <div class="controls-row">
        <button class="action-btn btn-red" onclick="removeBottle()" data-i18n="btnRemove">- 삭제</button>
        <span class="bottle-count-badge" id="bottle-count-display">Bottle: 6개</span>
        <button class="action-btn" onclick="addBottle()" data-i18n="btnAdd">+ 추가</button>
        <button class="action-btn btn-orange" id="btn-reset-selected" onclick="resetSelectedBottle()" disabled data-i18n="btnResetSelected">선택 병 비우기</button>
        <button class="action-btn btn-orange" onclick="resetAll()" data-i18n="btnResetAll">전체 초기화</button>
        <!-- 배치 정답 구하기 버튼만 강조 스타일 유지 -->
        <button class="action-btn btn-solve-highlight" onclick="solve()" id="solve-btn" data-i18n="btnSolve">배치 정답 구하기 🚀</button>
      </div>

      <!-- 정답 결과 컨테이너 -->
      <div class="solution-container" id="solution-container">
          <div class="tab-control-bar">
              <button class="tab-btn active" id="tab-btn-image" onclick="setSolutionTab('image')" data-i18n="tabImage">🎨 이미지 답</button>
              <button class="tab-btn" id="tab-btn-text" onclick="setSolutionTab('text')" data-i18n="tabText">📄 텍스트 답</button>
          </div>

          <div class="solution-content-area">
              <div class="result-image-panel" id="solution-output-image">
                  <canvas id="solution-canvas"></canvas>
              </div>

              <div class="result-text-panel" id="solution-output-text"></div>
          </div>
      </div>

    </div>
  </div>
</div>

<script>
let currentLang = 'ko';

const translations = {
  ko: {
    pageTitle: "개미군단 - 과일주스 V12",
    navTitle: "과일주스",
    navNemo: "네모",
    navReset: "초기화",
    uploadBtn: "📷 게임 스크린샷 앨범에서 선택하여 자동 인식",
    uploadDesc: "스크린샷을 선택하면 빈 병 수와 색상('?' 포함)을 자동으로 추출합니다. <br>",
    instruction1: (bottleIdx) => `<b>단계 1:</b> 아래 그리드에서 <b style="color:var(--selected-bottle);">입력할 빈 병을 먼저 클릭</b>하세요.`,
    instruction2: (bottleIdx) => `<b>단계 2:</b> 상단 팔레트에서 <b style="color:var(--accent);">채울 색상을 클릭</b>하여 <b>${bottleIdx + 1}번 Bottle</b>을 채우세요. 모르는 칸은 '?'를 쓰세요.`,
    btnAddColor: "+ 색상 추가",
    btnDelColor: "- 색상 삭제",
    btnRemove: "- 삭제",
    btnAdd: "+ 추가",
    btnResetSelected: "선택 병 비우기",
    btnResetAll: "전체 초기화",
    btnSolve: "배치 정답 구하기 🚀",
    tabImage: "🎨 이미지 답",

function toggleLanguage() {
  currentLang = currentLang === 'ko' ? 'en' : 'ko';
  document.documentElement.lang = currentLang;
  updateTexts();
  renderPalette();
  renderBottles();
  updateInstructionText();
  updateSolutionControls();
}

function updateTexts() {
  const t = translations[currentLang];
  document.getElementById('page-title').textContent = t.pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) {
      el.innerHTML = t[key];
    }
  });
  document.getElementById('custom-hex').placeholder = t.customPlaceholder;
}

// 기본 색상 목록 (HEX 기준)
const initialColors = [
  "A21A1A", "CF560D", "DBB06C", "659D5C",
  "0D670F", "3E7EC8", "332B7E", "F297E4",
  "959593", "86661B", "9A059F", "58C9C7",
  "BE3C68", "7058C6"
];

let colors = [...initialColors];
let selectedBottleIndex = null;
let selectedPaletteHex = null;
let bottleCount = 6;
let bottlesData = [];

// 같은 브라우저에서 페이지를 닫았다 다시 열어도 퍼즐 진행상태를 이어갑니다.
const PUZZLE_STORAGE_KEY = 'watersort_puzzle_state_v1';

function savePuzzleState() {
  try {
    localStorage.setItem(PUZZLE_STORAGE_KEY, JSON.stringify({
      bottleCount,
      bottlesData,
      selectedBottleIndex,
      selectedPaletteHex
    }));
  } catch (e) {
    console.warn('퍼즐 상태 저장 실패:', e);
  }
}

function loadPuzzleState() {
  try {
    const saved = localStorage.getItem(PUZZLE_STORAGE_KEY);
    if (!saved) return false;

    const parsed = JSON.parse(saved);
    if (!parsed || !Array.isArray(parsed.bottlesData)) return false;

    const count = Number(parsed.bottleCount);
    if (!Number.isInteger(count) || count < 4 || count > 40) return false;

    bottleCount = count;
    bottlesData = Array.from({ length: bottleCount }, (_, i) => {
      const bottle = parsed.bottlesData[i];
      return Array.isArray(bottle) ? bottle.slice(0, 4) : [];
    });

    selectedBottleIndex =
      Number.isInteger(parsed.selectedBottleIndex) &&
      parsed.selectedBottleIndex >= 0 &&
      parsed.selectedBottleIndex < bottleCount
        ? parsed.selectedBottleIndex
        : null;

    selectedPaletteHex =
      parsed.selectedPaletteHex === '?' ||
      parsed.selectedPaletteHex === null ||
      (typeof parsed.selectedPaletteHex === 'string' && colors.includes(parsed.selectedPaletteHex))
        ? parsed.selectedPaletteHex
        : null;

    return true;
  } catch (e) {
    console.warn('저장된 퍼즐 상태를 불러오는 데 실패했습니다:', e);
    return false;
  }
}

function loadSavedColors() {
  const saved = localStorage.getItem('watersort_custom_colors');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        parsed.forEach(c => {
          if (!colors.includes(c)) colors.push(c);
        });
      }
    } catch(e) {
      console.error("저장된 색상을 불러오는 데 실패했습니다.", e);
    }
  }
}

function saveColorsToStorage() {
  localStorage.setItem('watersort_custom_colors', JSON.stringify(colors));
}

function setScale(scale, btn) {
  const wrapper = document.getElementById("zoom-wrapper");
  wrapper.style.transform = `scale(${scale})`;
  document.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}

function init() {
  loadSavedColors();

  // 저장된 퍼즐이 있으면 그대로 이어서 하고,
  // 없을 때만 기본 6병 상태로 시작합니다.
  const restored = loadPuzzleState();
  if (!restored) {
    bottleCount = 6;
    bottlesData = Array.from({ length: bottleCount }, () => []);
    selectedBottleIndex = null;
    selectedPaletteHex = null;
  }

  renderPalette();
  renderBottles();
  updateInstructionText();
  updateTexts();
}

function updateInstructionText() {
  const insText = document.getElementById('instruction-text');
  const t = translations[currentLang];
  if (selectedBottleIndex === null) {
    insText.innerHTML = t.instruction1(selectedBottleIndex);
  } else {
    insText.innerHTML = t.instruction2(selectedBottleIndex);
  }
}

function getColorCountsFromBoard() {
  const counts = {};
  bottlesData.forEach(bottle => {
    bottle.forEach(color => {
      if (color !== '?') {
        counts[color] = (counts[color] || 0) + 1;
      }
    });
  });
  return counts;
}

function renderPalette() {
  const paletteEl = document.getElementById('palette');
  paletteEl.innerHTML = '';
  const boardColorCounts = getColorCountsFromBoard();
  const t = translations[currentLang];

  // 지우개
  const eraserWrapper = document.createElement('div');
  eraserWrapper.className = 'color-swatch-wrapper';
  const eraser = document.createElement('div');
  eraser.className = `color-swatch eraser`;
  eraser.innerText = '✕';
  eraser.title = t.eraserTitle;
  eraser.onclick = () => handleColorInput(null);
  eraserWrapper.appendChild(eraser);
  paletteEl.appendChild(eraserWrapper);

  // 물음표
  const unknownWrapper = document.createElement('div');
  unknownWrapper.className = 'color-swatch-wrapper';
  const unknown = document.createElement('div');
  unknown.className = `color-swatch unknown`;
  unknown.innerText = '?';
  unknown.title = t.unknownTitle;
  unknown.onclick = () => handleColorInput('?');
  unknownWrapper.appendChild(unknown);
  paletteEl.appendChild(unknownWrapper);

  // 일반 색상
  colors.forEach(hex => {
    const swatchWrapper = document.createElement('div');
    swatchWrapper.className = 'color-swatch-wrapper';

    const swatch = document.createElement('div');
    swatch.className = `color-swatch`;
    if(["DBB06C", "959593", "F297E4", "58C9C7"].includes(hex)) {
        swatch.classList.add('dark-text');
    }
    if (selectedPaletteHex === hex) {
        swatch.classList.add('selected-color');
    }
    swatch.style.backgroundColor = `#${hex}`;
    swatch.title = `#${hex}`;
    swatch.onclick = () => handleColorInput(hex);

    const count = boardColorCounts[hex] || 0;
    swatch.innerText = count;

    swatchWrapper.appendChild(swatch);
    paletteEl.appendChild(swatchWrapper);
  });
}

function renderBottles() {
  const container = document.getElementById('bottles-container');
  container.innerHTML = '';
  const t = translations[currentLang];

  bottlesData.forEach((bottle, bIdx) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'bottle-wrapper';

    const bottleEl = document.createElement('div');
    bottleEl.className = `bottle ${selectedBottleIndex === bIdx ? 'selected' : ''}`;
    bottleEl.onclick = () => selectTargetBottle(bIdx);

    for (let sIdx = 0; sIdx < 4; sIdx++) {
      const seg = document.createElement('div');
      seg.className = 'segment';
      if (bottle[sIdx]) {
        if (bottle[sIdx] === '?') {
            seg.style.backgroundColor = 'var(--unknown-color)'; 
            seg.innerText = '?';
        } else {
            seg.style.backgroundColor = `#${bottle[sIdx]}`;
            seg.innerText = '';
        }
      } else {
        seg.innerText = '';
      }
      bottleEl.appendChild(seg);
    }

    const num = document.createElement('div');
    num.className = 'bottle-num';
    num.innerText = bIdx + 1;

    wrapper.appendChild(bottleEl);
    wrapper.appendChild(num);
    container.appendChild(wrapper);
  });

  document.getElementById('bottle-count-display').innerText = t.bottleCountText(bottleCount);
  
  const resetSelectedBtn = document.getElementById('btn-reset-selected');
  if (selectedBottleIndex !== null) {
    resetSelectedBtn.removeAttribute('disabled');
  } else {
    resetSelectedBtn.setAttribute('disabled', 'true');
  }
}

function selectTargetBottle(bottleIdx) {
  selectedBottleIndex = (selectedBottleIndex === bottleIdx) ? null : bottleIdx;
  renderBottles(); 
  updateInstructionText();
  savePuzzleState();
}

function handleColorInput(hex) {
  selectedPaletteHex = hex;
  renderPalette();

  if (selectedBottleIndex === null) {
    savePuzzleState();
    return;
  }

  let bottle = bottlesData[selectedBottleIndex];

  if (hex === null) {
    if (bottle.length > 0) bottle.pop();
  } else {
    if (bottle.length < 4) bottle.push(hex);
  }
  renderBottles(); 
  renderPalette();
  savePuzzleState();
}

function addBottle() {
  if (bottleCount < 40) {
    bottleCount++;
    bottlesData.push([]);
    selectedBottleIndex = bottlesData.length - 1;
    renderBottles();
    updateInstructionText();
    savePuzzleState();
  }
}

function removeBottle() {
  if (bottleCount > 4) {
    bottleCount--;
    bottlesData.pop();
    if (selectedBottleIndex >= bottleCount) selectedBottleIndex = null;
    renderBottles();
    renderPalette();
    updateInstructionText();
    savePuzzleState();
  }
}

function resetSelectedBottle() {
  if (selectedBottleIndex !== null && bottlesData[selectedBottleIndex]) {
    bottlesData[selectedBottleIndex] = [];
    renderBottles();
    renderPalette();
    savePuzzleState();
  }
}

function resetAll() {
  bottleCount = 6;
  bottlesData = Array.from({ length: bottleCount }, () => []);
  selectedBottleIndex = null;
  selectedPaletteHex = null;
  document.getElementById('solution-container').style.display = 'none';

  // 사용자가 '전체 초기화'를 눌렀을 때만 저장된 진행상태를 삭제합니다.
  try {
    localStorage.removeItem(PUZZLE_STORAGE_KEY);
  } catch (e) {
    console.warn('저장된 퍼즐 상태 삭제 실패:', e);
  }

  renderBottles();
  renderPalette();
  updateInstructionText();
}

function addCustomColor() {
  const input = document.getElementById('custom-hex');
  const t = translations[currentLang];
  let hex = input.value.trim().replace('#', '').toUpperCase();
  if (hex.length === 6 && /^[0-9A-F]{6}$/i.test(hex)) {
    if (!colors.includes(hex)) {
      colors.push(hex);
      saveColorsToStorage();
      renderPalette();
    }
    input.value = '';
  } else {
    alert(t.customAlert);
  }
}

function deleteSelectedPaletteColor() {
  const t = translations[currentLang];
  if (!selectedPaletteHex || selectedPaletteHex === '?') {
    alert(t.delAlert1);
    return;
  }

  if (initialColors.includes(selectedPaletteHex)) {
    alert(t.delAlert2);
    return;
  }

  if (confirm(t.delConfirm(selectedPaletteHex))) {
    colors = colors.filter(c => c !== selectedPaletteHex);
    selectedPaletteHex = null;
    saveColorsToStorage();
    renderPalette();
  }
}

function setSolutionTab(tabType) {
    const textPanel = document.getElementById('solution-output-text');
    const imagePanel = document.getElementById('solution-output-image');
    const textBtn = document.getElementById('tab-btn-text');
    const imageBtn = document.getElementById('tab-btn-image');

    if (tabType === 'text') {
        textPanel.style.display = 'block';
        imagePanel.style.display = 'none';
        textBtn.classList.add('active');
        imageBtn.classList.remove('active');
    } else {
        textPanel.style.display = 'none';
        imagePanel.style.display = 'block';
        textBtn.classList.remove('active');
        imageBtn.classList.add('active');
    }
}

function triggerFileUpload() {
  const fileInput = document.getElementById('image-input');
  fileInput.value = ''; 
  fileInput.click();    
}

async function processUploadedImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const t = translations[currentLang];
  try {
    const result = await detectPuzzleFromImageFile(file);
    const puzzle = result.puzzle;

    // imageImport.js는 bottom -> top 순서의 color index를 반환한다.
    bottlesData = (puzzle.tubes || []).map(tube => {
      const out = [];
      for (const cell of (tube.colors || [])) {
        if (cell.hidden && cell.color === null) {
          out.push('?');
        } else if (Number.isInteger(cell.color) && DEFAULT_PALETTE[cell.color]) {
          out.push(DEFAULT_PALETTE[cell.color].replace('#', '').toUpperCase());
        }
      }
      return out;
    });

    bottleCount = bottlesData.length;
    selectedBottleIndex = null;
    selectedPaletteHex = null;

    renderBottles();
    renderPalette();
    updateInstructionText();

    const hiddenCount = bottlesData.flat().filter(c => c === '?').length;
    const emptyCount = bottlesData.filter(b => b.length === 0).length;
    let msg = `✨ 이미지 분석 완료! 총 ${bottleCount}개의 Bottle이 세팅되었습니다.`;
    if (hiddenCount > 0) msg += ` 물음표 ${hiddenCount}칸도 인식했습니다.`;
    if (emptyCount > 0) msg += ` 빈 병 ${emptyCount}개도 반영했습니다.`;
    alert(msg);

    // 개발/검증용: 실제 검출 결과를 콘솔에서 확인할 수 있다.
    console.debug('[WaterSort Image Import]', result.debug, bottlesData);
  } catch (error) {
    console.error(error);
    alert(`❌ 이미지 인식 실패: ${error instanceof Error ? error.message : '이미지를 해석하지 못했습니다.'}`);
  }
}

function inferMissingColors(boardState) {
    const currentState = boardState.map(f => [...f]);
    const knownColorCounts = {};
    const questionMarkPositions = [];

    currentState.forEach((bottle, bIdx) => {
        bottle.forEach((color, sIdx) => {
            if (color === '?') questionMarkPositions.push({bIdx, sIdx});
            else knownColorCounts[color] = (knownColorCounts[color] || 0) + 1;
        });
    });
    if (questionMarkPositions.length === 0) return currentState;

    const usedColors = [...new Set(currentState.flat().filter(c => c !== '?'))];
    const remaining = {};
    usedColors.forEach(color => {
        const n = 4 - (knownColorCounts[color] || 0);
        if (n > 0) remaining[color] = n;
        else if (n < 0) throw new Error(`모순 발생: 색상 #${color}이(가) 이미 ${knownColorCounts[color]}칸 사용되었습니다.`);
    });

    const total = Object.values(remaining).reduce((a,b) => a+b, 0);
    if (total !== questionMarkPositions.length) {
        throw new Error(`모순 발생: 추론에 필요한 남은 색상 칸 수(${total})와 물음표 개수(${questionMarkPositions.length})가 일치하지 않습니다.`);
    }

    function shuffle(a) {
        a = a.slice();
        for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
        return a;
    }

    function canPlace(pos, color) {
        const bottle = currentState[pos.bIdx];
        if (pos.sIdx > 0 && bottle[pos.sIdx-1] === color) return false;
        if (pos.sIdx + 1 < bottle.length && bottle[pos.sIdx+1] === color) return false;
        return true;
    }

    function choosePosition(unresolved) {
        let best = null, bestCandidates = null;
        for (const pos of unresolved) {
            const candidates = shuffle(Object.keys(remaining)).filter(c => remaining[c] > 0 && canPlace(pos,c));
            if (!candidates.length) return {pos, candidates: []};
            if (!best || candidates.length < bestCandidates.length) { best=pos; bestCandidates=candidates; }
        }
        return {pos:best, candidates:bestCandidates || []};
    }

    function backtrack(unresolved) {
        if (!unresolved.length) return true;
        const choice = choosePosition(unresolved);
        if (!choice.pos || !choice.candidates.length) return false;
        for (const color of shuffle(choice.candidates)) {
            const pos = choice.pos;
            if (!remaining[color] || !canPlace(pos,color)) continue;
            currentState[pos.bIdx][pos.sIdx] = color;
            remaining[color]--;
            const next = unresolved.filter(p => p.bIdx !== pos.bIdx || p.sIdx !== pos.sIdx);
            if (backtrack(next)) return true;
            remaining[color]++;
            currentState[pos.bIdx][pos.sIdx] = '?';
        }
        return false;
    }

    if (!backtrack(questionMarkPositions)) {
        throw new Error('모순 발생: 물음표에 색상을 배정하면서 같은 색이 연속되지 않도록 하는 조합을 찾을 수 없습니다.');
    }
    return currentState;
}

function solve() {
  selectedBottleIndex = null;
  renderBottles();
  updateInstructionText();

  const container = document.getElementById('solution-container');
  const outputText = document.getElementById('solution-output-text');
  const t = translations[currentLang];
  
  container.style.display = 'block';
  setSolutionTab('image');
  outputText.innerHTML = `<div style="text-align:center; color:var(--accent); padding:20px;">${t.engineRunning}</div>`;

  const initialStateData = bottlesData.map(f => [...f]);

  let totalUnits = initialStateData.flat().length;
  if (totalUnits === 0) {
    outputText.innerHTML = `<span style="color:#ff5555;">${t.emptyBottlesWarn}</span>`;
    setSolutionTab('text');
    return;
  }

  let resolvedStateData;
  try {
      resolvedStateData = inferMissingColors(initialStateData);
  } catch (error) {
      outputText.innerHTML = t.inconsistencyErr(error.message);
      setSolutionTab('text');
      return;
  }

  let colorCounts = {};
  resolvedStateData.forEach(f => {
    f.forEach(c => colorCounts[c] = (colorCounts[c] || 0) + 1);
  });

  const invalidColors = [];
  for (let c in colorCounts) {
    if (colorCounts[c] !== 4) {
        invalidColors.push(`<span class="color-dot" style="background:#${c};"></span>(#${c}, ${colorCounts[c]}칸)`);
    }
  }

  if(invalidColors.length > 0) {
    outputText.innerHTML = t.ruleFailErr(invalidColors.join(', '));
    setSolutionTab('text');
    return;
  }

  // === 고속 Water Sort Solver ===
  // 기존 BFS는 병 수가 많거나 빈 병이 3개인 어려운 배치에서
  // 상태 공간이 급격히 커져 7초 제한에 걸릴 수 있습니다.
  // 색상 이름은 퍼즐의 규칙상 서로 대칭이므로, 탐색 중에는
  // "등장 순서 기준 색상 정규화"를 사용해 동일한 구조의 상태를 합칩니다.
  // 병의 순서는 유지하므로 반환되는 from/to 번호는 실제 병 번호와 일치합니다.

  function canonicalizeColors(state) {
    const colorMap = new Map();
    let nextColor = 0;
    return state.map(bottle => bottle.map(color => {
      if (!colorMap.has(color)) colorMap.set(color, nextColor++);
      return colorMap.get(color);
    }));
  }

  function stateKey(state) {
    return state.map(bottle => bottle.join(',')).join('|');
  }

  function heuristic(state, colorCount) {
    // 한 번의 붓기로 줄일 수 있는 "색상 블록(run)"은 최대 1개이므로
    // runs - 색상수는 풀이에 필요한 붓기 횟수의 하한으로 사용할 수 있습니다.
    let runs = 0;
    for (const bottle of state) {
      for (let i = 0; i < bottle.length; i++) {
        if (i === 0 || bottle[i] !== bottle[i - 1]) runs++;
      }
    }
    return Math.max(0, runs - colorCount);
  }

  function solveWithFastDFS(startState, timeLimitMs = 15000) {
    const colorCount = new Set(startState.flat()).size;
    const start = canonicalizeColors(startState);
    const path = [];
    const visited = new Map();
    const startTime = performance.now();
    let nodeCount = 0;
    let timedOut = false;

    function isSolvedFast(state) {
      return state.every(bottle =>
        bottle.length === 0 || (bottle.length === 4 && bottle.every(c => c === bottle[0]))
      );
    }

    function getMoves(state, lastMove) {
      const moves = [];

      for (let from = 0; from < state.length; from++) {
        const src = state[from];
        if (src.length === 0) continue;

        const color = src[src.length - 1];
        let amount = 1;
        while (amount < src.length && src[src.length - 1 - amount] === color) amount++;

        for (let to = 0; to < state.length; to++) {
          if (from === to) continue;
          const dest = state[to];
          if (dest.length >= 4) continue;
          if (dest.length > 0 && dest[dest.length - 1] !== color) continue;

          // 바로 직전 이동의 완전한 역이동은 제거합니다.
          if (lastMove && from === lastMove.to && to === lastMove.from) continue;

          let pourAmount;
          let priority;
          if (dest.length === 0) {
            // 같은 색 한 덩어리를 빈 병으로 옮기는 것은 구조를 전혀
            // 개선하지 않으므로 제외합니다. 혼합 병을 비우는 이동은 허용합니다.
            if (amount === src.length) continue;
            pourAmount = amount;
            priority = 1;
          } else {
            pourAmount = Math.min(amount, 4 - dest.length);
            priority = 0; // 같은 색 위로 붓는 이동을 우선
          }

          if (pourAmount <= 0) continue;

          const next = state.map(b => b.slice());
          for (let n = 0; n < pourAmount; n++) next[to].push(next[from].pop());

          const canonicalNext = canonicalizeColors(next);
          const key = stateKey(canonicalNext);
          const h = heuristic(canonicalNext, colorCount);

          moves.push({ from, to, amount: pourAmount, priority, h, state: canonicalNext, key });
        }
      }

      // 같은 색으로 합치는 이동 + 휴리스틱상 유리한 상태를 먼저 탐색합니다.
      moves.sort((a, b) => a.priority - b.priority || a.h - b.h);
      return moves;
    }

    function dfs(state, depth, lastMove) {
      nodeCount++;
      if ((nodeCount & 2047) === 0 && performance.now() - startTime > timeLimitMs) {
        timedOut = true;
        return false;
      }

      if (isSolvedFast(state)) return true;

      const key = stateKey(state);
      const previousDepth = visited.get(key);
      if (previousDepth !== undefined && previousDepth <= depth) return false;
      visited.set(key, depth);

      const moves = getMoves(state, lastMove);
      for (const move of moves) {
        if (timedOut) return false;

        path.push({
          from: move.from + 1,
          to: move.to + 1,
          color: state[move.from][state[move.from].length - 1],
          amount: move.amount
        });

        if (dfs(move.state, depth + 1, move)) return true;
        path.pop();
      }
      return false;
    }

    const found = dfs(start, 0, null);
    return {
      path: found ? path.slice() : null,
      timedOut,
      nodeCount,
      elapsedMs: performance.now() - startTime
    };
  }

  const searchResult = solveWithFastDFS(resolvedStateData, 15000);
  const foundPath = searchResult.path;

  // 탐색 중에는 색상 이름을 정규화했기 때문에, 결과 표시 직전에
  // 실제 퍼즐의 HEX 색상으로 다시 매핑합니다.
  if (foundPath) {
    const replayState = resolvedStateData.map(b => [...b]);
    foundPath.forEach(step => {
      const source = replayState[step.from - 1];
      step.color = source[source.length - 1];
      for (let n = 0; n < step.amount; n++) {
        replayState[step.to - 1].push(source.pop());
      }
    });
  }
  if (foundPath) {
    if (foundPath.length === 0) {
      outputText.innerHTML = `<b style="color:var(--accent);">${t.alreadySolved}</b>`;
      setSolutionTab('text');
    } else {
      document.getElementById('solution-container').style.display = 'block';

      let html = `<div style="padding-bottom:10px; border-bottom:2px solid #2a4c3b; margin-bottom:10px;"><b style="color:var(--accent); font-size:1.3rem;">${t.totalSteps(foundPath.length)}</b></div>`;
      foundPath.forEach((step, idx) => {
        html += `<div class="step-item">
          <span class="step-num">${idx+1}.</span>
          <span><b>${step.from}번</b><span class="pour-arrow">➡️</span><b>${step.to}번</b></span>
          <span class="color-dot" style="background:#${step.color};"></span>
        </div>`;
      });
      outputText.innerHTML = html;

      drawVisualSolutionImage(foundPath, resolvedStateData);
      setSolutionTab('image');
    }
  } else {
    document.getElementById('solution-container').style.display = 'block';
    setSolutionTab('text');
    outputText.innerHTML = t.failTimeout;
  }
}

function drawVisualSolutionImage(path, inferredBoardState) {
    const initialState = inferredBoardState.map(f => [...f]);
    const states = [initialState];
    let currentState = initialState.map(f => [...f]);

    path.forEach(move => {
        const nextState = currentState.map(f => [...f]);
        const src = nextState[move.from - 1];
        const dest = nextState[move.to - 1];
        for (let i = 0; i < move.amount; i++) dest.push(src.pop());
        states.push(nextState);
        currentState = nextState;
    });

    solutionAnimation = {
        path,
        states,
        currentStep: 0,
        animating: false,
    autoPlaying: false,
    autoTimer: null,
    autoInterval: 500,
        direction: 'forward',
        unitIndex: 0,
        unitCount: 0,
        fromBottle: null,
        toBottle: null,
        color: null,
        startTime: 0,
        duration: 420,
        raf: null
    };

    createSolutionControls();
    renderSolutionFrame();
}

let solutionAnimation = {
    path: [], states: [], currentStep: 0, animating: false,
    autoPlaying: false,
    autoTimer: null,
    autoInterval: 500,
    direction: 'forward', unitIndex: 0, unitCount: 0,
    fromBottle: null, toBottle: null, color: null,
    startTime: 0, duration: 500, raf: null
};

function createSolutionControls() {
    const panel = document.getElementById('solution-output-image');
    let controls = document.getElementById('solution-animation-controls');

    if (!controls) {
        const t = translations[currentLang];
        controls = document.createElement('div');
        controls.id = 'solution-animation-controls';
        controls.innerHTML = `
            <button type="button" id="solution-prev-btn" class="solution-nav-btn" onclick="solutionPreviousStep()">${t.solutionPrev}</button>
            <div id="solution-step-indicator">0 / 0</div>
            <button type="button" id="solution-next-btn" class="solution-nav-btn" onclick="solutionNextStep()">${t.solutionNext}</button>
            <button type="button" id="solution-auto-btn" class="solution-nav-btn solution-auto-btn" onclick="toggleSolutionAuto()">${t.solutionAutoStart}</button>
            <div class="solution-speed-wrap">
                <label for="solution-speed" id="solution-speed-label">${t.solutionSpeedLabel}</label>
                <select id="solution-speed" onchange="changeSolutionSpeed(this.value)">
                    <option value="0.25">${t.solutionSpeedOptions["0.25"]}</option>
                    <option value="0.5" selected>${t.solutionSpeedOptions["0.5"]}</option>
                    <option value="0.75">${t.solutionSpeedOptions["0.75"]}</option>
                    <option value="1">${t.solutionSpeedOptions["1"]}</option>
                    <option value="1.25">${t.solutionSpeedOptions["1.25"]}</option>
                </select>
            </div>
        `;
        panel.appendChild(controls);
    }
    updateSolutionControls();
}

function updateSolutionControls() {
    const total = solutionAnimation.path.length;
    const current = solutionAnimation.currentStep;
    const prev = document.getElementById('solution-prev-btn');
    const next = document.getElementById('solution-next-btn');
    const auto = document.getElementById('solution-auto-btn');
    const indicator = document.getElementById('solution-step-indicator');
    const speedLabel = document.getElementById('solution-speed-label');
    const speedSelect = document.getElementById('solution-speed');
    if (!prev || !next || !indicator) return;

    const t = translations[currentLang];
    prev.textContent = t.solutionPrev;
    next.textContent = t.solutionNext;
    indicator.textContent = `${current} / ${total}`;
    prev.disabled =
        solutionAnimation.animating ||
        solutionAnimation.autoPlaying ||
        current <= 0;

    next.disabled =
        solutionAnimation.animating ||
        solutionAnimation.autoPlaying ||
        current >= total;

    if (auto) {
        auto.textContent =
            solutionAnimation.autoPlaying ? t.solutionAutoStop : t.solutionAutoStart;
        auto.disabled =
            current >= total && !solutionAnimation.autoPlaying;
        auto.classList.toggle(
            'solution-auto-active',
            solutionAnimation.autoPlaying
        );
    }

    if (speedLabel) {
        speedLabel.textContent = t.solutionSpeedLabel;
    }

    if (speedSelect) {
        Array.from(speedSelect.options).forEach(opt => {
            const label = t.solutionSpeedOptions[opt.value];
            if (label) opt.textContent = label;
        });
    }
}

function solutionNextStep() {
    if (solutionAnimation.animating) return;
    if (solutionAnimation.currentStep >= solutionAnimation.path.length) return;

    const step = solutionAnimation.path[solutionAnimation.currentStep];
    startSolutionAnimation('forward', solutionAnimation.currentStep, step);
}

function solutionPreviousStep() {
    if (solutionAnimation.animating) return;
    if (solutionAnimation.currentStep <= 0) return;

    const stepIndex = solutionAnimation.currentStep - 1;
    const step = solutionAnimation.path[stepIndex];
    startSolutionAnimation('backward', stepIndex, step);
}

function startSolutionAnimation(direction, stepIndex, move) {
    cancelSolutionAnimation();

    const amount = Math.max(1, Number(move.amount) || 1);
    solutionAnimation.animating = true;
    solutionAnimation.direction = direction;
    solutionAnimation.unitIndex = 0;
    solutionAnimation.unitCount = amount;
    solutionAnimation.fromBottle = (direction === 'forward' ? move.from : move.to) - 1;
    solutionAnimation.toBottle = (direction === 'forward' ? move.to : move.from) - 1;
    solutionAnimation.color = move.color;
    solutionAnimation.currentMoveStep = stepIndex;
    solutionAnimation.startTime = performance.now();

    updateSolutionControls();
    solutionAnimation.raf = requestAnimationFrame(animateSolutionMove);
}

function cancelSolutionAnimation() {
    if (solutionAnimation.raf) {
        cancelAnimationFrame(solutionAnimation.raf);
        solutionAnimation.raf = null;
    }
    solutionAnimation.animating = false;
}


function changeSolutionSpeed(value) {
    const seconds = parseFloat(value);

    if (!Number.isFinite(seconds)) return;

    solutionAnimation.duration = seconds * 1000;

    /*
     * 자동 재생 중에도 다음 이동부터 바로 적용됩니다.
     * 현재 진행 중인 애니메이션은 현재 속도로 마무리됩니다.
     */
    updateSolutionControls();
}

function toggleSolutionAuto() {
    if (solutionAnimation.autoPlaying) {
        stopSolutionAuto();
    } else {
        startSolutionAuto();
    }
}

function startSolutionAuto() {
    if (solutionAnimation.autoPlaying) return;

    if (solutionAnimation.currentStep >= solutionAnimation.path.length) {
        solutionAnimation.currentStep = 0;
        renderSolutionFrame();
    }

    solutionAnimation.autoPlaying = true;
    updateSolutionControls();
    runSolutionAutoStep();
}

function stopSolutionAuto() {
    solutionAnimation.autoPlaying = false;

    if (solutionAnimation.autoTimer) {
        clearTimeout(solutionAnimation.autoTimer);
        solutionAnimation.autoTimer = null;
    }

    if (solutionAnimation.animating) {
        cancelSolutionAnimation();
        renderSolutionFrame();
    }

    updateSolutionControls();
}

function runSolutionAutoStep() {
    if (!solutionAnimation.autoPlaying || solutionAnimation.animating) return;

    if (solutionAnimation.currentStep >= solutionAnimation.path.length) {
        stopSolutionAuto();
        return;
    }

    startSolutionAnimation(
        'forward',
        solutionAnimation.currentStep,
        solutionAnimation.path[solutionAnimation.currentStep]
    );
}

function animateSolutionMove(timestamp) {
    if (!solutionAnimation.animating) return;

    const elapsed = timestamp - solutionAnimation.startTime;
    const progress = Math.min(elapsed / solutionAnimation.duration, 1);
    const eased = easeInOutCubic(progress);

    renderSolutionFrame(solutionAnimation.currentStep, {
        animating: true,
        progress: eased,
        direction: solutionAnimation.direction,
        stepIndex: solutionAnimation.currentMoveStep
    });

    if (progress < 1) {
        solutionAnimation.raf = requestAnimationFrame(animateSolutionMove);
        return;
    }

    if (solutionAnimation.direction === 'forward') {
        solutionAnimation.currentStep = solutionAnimation.currentMoveStep + 1;
    } else {
        solutionAnimation.currentStep = solutionAnimation.currentMoveStep;
    }

    solutionAnimation.animating = false;
    solutionAnimation.raf = null;
    renderSolutionFrame();
    updateSolutionControls();

    if (
        solutionAnimation.autoPlaying &&
        solutionAnimation.currentStep < solutionAnimation.path.length
    ) {
        solutionAnimation.autoTimer = setTimeout(
            runSolutionAutoStep,
            solutionAnimation.autoInterval
        );
    } else if (
        solutionAnimation.autoPlaying &&
        solutionAnimation.currentStep >= solutionAnimation.path.length
    ) {
        stopSolutionAuto();
    }
}

function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function getIntermediateState(stepIndex, direction) {
    const move = solutionAnimation.path[stepIndex];
    const baseIndex = direction === 'forward' ? stepIndex : stepIndex + 1;
    const state = solutionAnimation.states[baseIndex].map(b => [...b]);
    const from = (direction === 'forward' ? move.from : move.to) - 1;
    const amount = Math.max(1, Number(move.amount) || 1);

    /*
     * 같은 색이 연속된 만큼(amount) 한 번에 묶어서 이동하는 애니메이션이므로
     * 이동 중인 조각들은 출발 병에서 모두 빼서 "공중에 떠 있는" 상태로 그립니다.
     * (도착 병에는 애니메이션이 끝난 뒤에 한꺼번에 채워집니다)
     */
    state[from] = state[from].slice(0, Math.max(0, state[from].length - amount));
    return state;
}

function renderSolutionFrame(stepIndex = solutionAnimation.currentStep, animation = null) {
    const canvas = document.getElementById('solution-canvas');
    if (!canvas || !solutionAnimation.states.length) return;

    const ctx = canvas.getContext('2d');
    const numBottles = solutionAnimation.states[0].length;
    const isMobile = window.innerWidth <= 768;

    /*
     * 병은 최대 16개까지 반드시 한 줄에 표시합니다.
     * 현재 화면에서 16개가 들어갈 수 있는 최대 크기를 기준으로
     * 병의 폭과 간격을 자동 계산합니다.
     */
    const screenWidth = Math.max(
        320,
        Math.min(window.innerWidth - 16, 1600)
    );

    const INNER_PADDING_X = isMobile ? 8 : 18;

    // 병 사이 간격을 병 폭의 약 25%로 유지
    const GAP_RATIO = isMobile ? 0.20 : 0.25;

    const usableWidth =
        screenWidth - INNER_PADDING_X * 2;

    let BOTTLE_WIDTH = Math.floor(
        usableWidth /
        (
            numBottles +
            Math.max(0, numBottles - 1) * GAP_RATIO
        )
    );

    // 병 개수가 적으면 크게, 16개면 화면에 딱 맞게
    BOTTLE_WIDTH = Math.max(
        24,
        Math.min(BOTTLE_WIDTH, isMobile ? 58 : 78)
    );

    const BOTTLE_GAP_X = Math.max(
        4,
        Math.round(BOTTLE_WIDTH * GAP_RATIO)
    );

    // 기존 병의 세로 비율 유지
    const UNIT = Math.max(
        0.75,
        Math.min(2.0, BOTTLE_WIDTH / 32)
    );

    const BOTTLE_HEIGHT = 100 * UNIT;
    const SEGMENT_HEIGHT = BOTTLE_HEIGHT / 4;
    const TOP_AREA = 70 * UNIT;
    const BOTTOM_AREA = 30 * UNIT;

    const totalBottlesWidth =
        numBottles * BOTTLE_WIDTH +
        Math.max(0, numBottles - 1) * BOTTLE_GAP_X;

    const width = Math.max(
        320,
        totalBottlesWidth + INNER_PADDING_X * 2
    );
    const height = TOP_AREA + BOTTLE_HEIGHT + BOTTOM_AREA;

    canvas.width = Math.ceil(width);
    canvas.height = Math.ceil(height);

    ctx.fillStyle = '#091510';
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = 'top';

    const total = solutionAnimation.path.length;
    ctx.fillStyle = '#f3ca65';
    ctx.font = `700 ${18 * UNIT}px "Segoe UI", Arial`;
    ctx.textAlign = 'left';
    ctx.fillText(`#${solutionAnimation.currentStep} / ${total}`, INNER_PADDING_X, 12 * UNIT);

    let board;
    if (animation) {
        board = getIntermediateState(animation.stepIndex, animation.direction);
    } else {
        board = solutionAnimation.states[stepIndex].map(b => [...b]);
    }

    const startX = (width - totalBottlesWidth) / 2;
    const bottleY = TOP_AREA;

    for (let bottleIdx = 0; bottleIdx < numBottles; bottleIdx++) {
        const x = startX + bottleIdx * (BOTTLE_WIDTH + BOTTLE_GAP_X);
        drawSolutionBottle(ctx, board[bottleIdx], x, bottleY, BOTTLE_WIDTH, BOTTLE_HEIGHT, UNIT, bottleIdx);
    }

    if (animation && animation.animating) {
        drawMovingColor(ctx, board, animation, startX, bottleY, BOTTLE_WIDTH, BOTTLE_GAP_X, BOTTLE_HEIGHT, SEGMENT_HEIGHT, UNIT);
    } else if (solutionAnimation.currentStep < total) {
        drawSolutionMoveIndicator(ctx, solutionAnimation.path[solutionAnimation.currentStep], startX, bottleY, BOTTLE_WIDTH, BOTTLE_GAP_X, UNIT);
    }

    updateSolutionControls();
}

function drawSolutionBottle(ctx, bottle, x, y, width, height, UNIT, bottleIndex) {
    const radius = 7 * UNIT;
    ctx.strokeStyle = '#6cb885';
    ctx.lineWidth = 2 * UNIT;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + width, y);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.closePath();
    ctx.fillStyle = 'rgba(10, 23, 17, 0.8)';
    ctx.fill();
    ctx.stroke();

    const innerX = x + ctx.lineWidth;
    const innerWidth = width - ctx.lineWidth * 2;
    const segmentHeight = height / 4;

    for (let segIdx = 0; segIdx < 4; segIdx++) {
        const colorHex = bottle[segIdx];
        if (!colorHex) continue;

        const segY = y + height - ((segIdx + 1) * segmentHeight);
        ctx.fillStyle = colorHex === '?' ? '#583122' : `#${colorHex}`;

        if (segIdx === 0) {
            ctx.beginPath();
            ctx.moveTo(innerX, segY);
            ctx.lineTo(innerX + innerWidth, segY);
            ctx.lineTo(innerX + innerWidth, y + height - radius);
            ctx.quadraticCurveTo(innerX + innerWidth, y + height, innerX + innerWidth - radius, y + height);
            ctx.lineTo(innerX + radius, y + height);
            ctx.quadraticCurveTo(innerX, y + height, innerX, y + height - radius);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.fillRect(innerX, segY, innerWidth, segmentHeight);
        }

        if (colorHex === '?') {
            ctx.fillStyle = '#fff';
            ctx.font = `700 ${18 * UNIT}px "Segoe UI", Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('?', x + width / 2, segY + segmentHeight * 0.15);
        }

        if (segIdx < 3) {
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1 * UNIT;
            ctx.beginPath();
            ctx.moveTo(innerX + 3, segY);
            ctx.lineTo(innerX + innerWidth - 3, segY);
            ctx.stroke();
        }
    }

    if (bottle.length === 4 && bottle.every(c => c === bottle[0])) {
        // 완성된 병은 왕관 대신 고양이 얼굴 표시
        drawCompletedCatFace(ctx, x + width / 2, y - 18 * UNIT, UNIT);
    }

    ctx.fillStyle = '#fff';
    ctx.font = `800 ${15 * UNIT}px "Segoe UI", Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(bottleIndex + 1, x + width / 2, y + height + 6 * UNIT);
}

function drawCompletedCatFace(ctx, cx, cy, UNIT) {
    // 사용자가 제공한 하트눈 이모지를 완성 병 위에 그대로 표시합니다.
    if (!window.completedCatEmoji) {
        window.completedCatEmoji = new Image();
        window.completedCatEmoji.onload = () => {

function drawMovingColor(ctx, board, animation, startX, bottleY, bottleWidth, bottleGap, bottleHeight, segmentHeight, UNIT) {
    const from = solutionAnimation.fromBottle;
    const to = solutionAnimation.toBottle;
    if (from == null || to == null) return;

    const fromX = startX + from * (bottleWidth + bottleGap) + bottleWidth / 2;
    const toX = startX + to * (bottleWidth + bottleGap) + bottleWidth / 2;

    // board는 이동 중인 조각들이 출발 병에서 이미 제거된 상태이므로,
    // fromCountBefore/toCountBefore를 역산해서 이동 그룹 전체를 한 번에 그립니다.
    const amount = Math.max(1, solutionAnimation.unitCount || 1);
    const fromCountBefore = board[from].length + amount;
    const toCountBefore = board[to].length;

    const p = animation.progress;
    const x = fromX + (toX - fromX) * p;
    const arc = Math.max(32 * UNIT, Math.abs(toX - fromX) * 0.12);

    const w = bottleWidth - 4 * UNIT;
    const h = segmentHeight - 4 * UNIT;

    ctx.save();
    ctx.fillStyle = `#${solutionAnimation.color}`;
    ctx.shadowColor = `#${solutionAnimation.color}`;
    ctx.shadowBlur = 12 * UNIT;

    for (let k = 0; k < amount; k++) {
        // k = 0 -> 출발 병에서 가장 위(맨 위)에 있던 조각, 도착 병에서도 맨 위가 됨
        const sourceIndexFromBottom = fromCountBefore - 1 - k;
        const destIndexFromBottom = toCountBefore + amount - 1 - k;

        const startY = bottleY + bottleHeight - (sourceIndexFromBottom + 0.5) * segmentHeight;
        const endY = bottleY + bottleHeight - (destIndexFromBottom + 0.5) * segmentHeight;
        const y = startY + (endY - startY) * p - Math.sin(Math.PI * p) * arc;

        ctx.fillRect(x - w / 2, y - h / 2, w, h);
    }

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 1 * UNIT;
    for (let k = 0; k < amount; k++) {
        const sourceIndexFromBottom = fromCountBefore - 1 - k;
        const destIndexFromBottom = toCountBefore + amount - 1 - k;

        const startY = bottleY + bottleHeight - (sourceIndexFromBottom + 0.5) * segmentHeight;
        const endY = bottleY + bottleHeight - (destIndexFromBottom + 0.5) * segmentHeight;
        const y = startY + (endY - startY) * p - Math.sin(Math.PI * p) * arc;

        ctx.strokeRect(x - w / 2, y - h / 2, w, h);
    }
    ctx.restore();
}

function drawSolutionMoveIndicator(ctx, move, startX, bottleY, bottleWidth, bottleGap, UNIT) {
    const from = move.from - 1;
    const to = move.to - 1;
    const fromX = startX + from * (bottleWidth + bottleGap) + bottleWidth / 2;
    const toX = startX + to * (bottleWidth + bottleGap) + bottleWidth / 2;

    ctx.font = `${22 * UNIT}px "Segoe UI Emoji", Arial`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText('👆', fromX, bottleY - 34 * UNIT);
    ctx.fillText('👇', toX, bottleY - 34 * UNIT);
}

window.addEventListener('resize', () => {
    if (solutionAnimation.states && solutionAnimation.states.length) {
        renderSolutionFrame();
    }
});

window.onload = init;
