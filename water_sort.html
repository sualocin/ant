<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">개미군단 - 과일주스 V12</title>
<style>
/* === 다크 테마 CSS 스펙 === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06110c;--bg-soft:#0d1d16;--card:#0f221b;--card2:#152b21;
  --text:#e4ede7;--muted:#8ea89b;--dim:#5e786a;--line:#214032;
  --line-strong:#39614c;--accent:#f3ca65;--orange:#e67e22;
  --selected-bottle:#4da6ff;
  --unknown-color: #583122; 
}
html,body{min-height:100%;background:radial-gradient(circle at 50% 30%, #11261d 0%, #050e0a 100%);color:var(--text)}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  line-height:1.5;overflow-x:hidden;
}
button,input{font:inherit}

.site-navbar{
  position:sticky;top:0;z-index:20;background:#0c1c15f0;
  border-bottom:1px solid #214233;backdrop-filter:blur(14px);
}
.site-nav-inner{
  width:min(1200px,100%);margin:auto;min-height:58px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.site-nav-brand-link{display:flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;flex-shrink:0}
.site-nav-title{font-size:15px;font-weight:700;letter-spacing:.02em;color:#f3ca65;white-space:nowrap}
.site-nav-subtitle{font-size:9px;color:var(--muted);display:block;line-height:1}
.site-nav-links{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.site-nav-link{
  color:#d0e3d7;text-decoration:none;border:0;background:transparent;
  padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap;
}
.site-nav-link:hover{background:#ffffff0f}
.site-nav-link.active{color:var(--accent);background:#ffffff0a}

.container{width:min(1200px,100%);margin:auto;padding:18px 16px 35px}

.scale-controls{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;
}
.scale-btn{
  background:#12261e;color:#8ea89b;border:1px solid #214032;
  padding:4px 12px;font-size:12px;border-radius:12px;cursor:pointer;
  transition:all 0.15s ease;
}
.scale-btn:hover{background:#1d3d2e;color:#ffe9a9}
.scale-btn.active{background:#284c3a;color:#f3ca65;border-color:#3d7e56;font-weight:700}

#zoom-wrapper{
  width:100%;
  transform-origin: top center;
  transition: transform 0.2s ease;
}

.card{
  width:min(900px,100%); margin:auto;background:var(--card);
  border:1px solid #2a4c3b;border-radius:20px;padding:20px;
  box-shadow:0 10px 40px #000b, inset 0 0 15px rgba(0,0,0,0.6);
}

.section-title {
  text-align: center; color: var(--accent); font-size: 20px; font-weight: 700;
  margin-bottom: 15px; text-shadow: 0 0 10px rgba(243,202,101,0.3);
}

/* 이미지 업로드 영역 */
.upload-card-section {
  background: var(--card2);
  border: 1px dashed var(--accent);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 15px;
  text-align: center;
}
.upload-btn {
  display: inline-block;
  background: linear-gradient(180deg, #e67e22 0%, #a0500a 100%);
  color: #fff;
  padding: 8px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  border: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.1s ease;
}
.upload-btn:hover { transform: scale(1.03); }

/* 상단 팔레트 */
.palette-card-section {
  background: var(--card2);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
}

.instruction-text {
  text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px;
}
.instruction-text b { color: var(--accent); }

.color-palette {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
}

.color-swatch-wrapper {
  position: relative; width: 38px; height: 38px;
}

/* 색상 팔레트를 네모 형태로 변경 */
.color-swatch {
  width: 100%; height: 100%; border-radius: 8px;
  border: 2px solid #1a3328; cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

.color-swatch.dark-text { color: #000; text-shadow: none; }
.color-swatch:hover { transform: scale(1.15); border-color: var(--accent); }
.color-swatch.selected-color {
  border-color: #ff3366 !important;
  box-shadow: 0 0 12px #ff3366;
  transform: scale(1.1);
}

.color-swatch.eraser {
  background: #173024; color: #ff5555; font-size: 18px; border: 2px dashed #39614c;
}

.color-swatch.unknown {
  background: var(--unknown-color); 
  color: #fff; font-size: 18px; border: 2px solid #8ea89b;
}

.custom-color-box {
  display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.custom-color-box input {
  background: #091510; border: 1px solid var(--line-strong); color: #fff;
  padding: 5px 10px; border-radius: 8px; width: 100px; text-align: center;
  font-family: monospace; text-transform: uppercase; font-size: 13px;
}
.btn-sm {
  background: #1f482f; color: var(--text); border: 1px solid var(--line-strong);
  padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.btn-sm:hover { background: #28573a; color: var(--accent); }
.btn-del {
  background: #4d1f27; color: #ffb3c1; border-color: #802f3e;
}
.btn-del:hover { background: #6b2635; color: #fff; }

/* 하단 Clear Bottle 컨테이너 */
.bottles-container {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr)); 
  gap: 12px; justify-items: center; margin-bottom: 20px; padding: 15px 10px;
  background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--line);
}

@media (max-width: 1000px) {
  .bottles-container { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px 5px; }
  .bottle { max-width: 100%; height: 130px; border-radius: 0 0 12px 12px; border-width: 2px; }
  .bottle-wrapper { gap: 4px; }
  .bottle-num { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
}
@media (max-width: 480px) {
    .container { padding: 10px 8px; }
    .card { padding: 15px 10px; border-radius: 16px; }
    .bottles-container { gap: 5px; }
    .bottle { height: 110px; }
}

.bottle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%;}
.bottle-num { font-size: 12px; color: var(--dim); font-weight: bold; }

.bottle {
  width: 100%; max-width: 48px; height: 160px;
  background: rgba(10, 23, 17, 0.8);
  border: 3px solid #3d7e56; border-top: 1px solid #3d7e56;
  border-radius: 0 0 16px 16px;
  display: flex; flex-direction: column-reverse;
  overflow: hidden; cursor: pointer; position: relative;
  box-shadow: inset 0 0 10px #000, 0 4px 12px rgba(0,0,0,0.5);
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.bottle:hover { border-color: var(--dim); }

.bottle.selected {
  border-color: var(--selected-bottle) !important;
  box-shadow: 0 0 20px rgba(77, 166, 255, 0.7), inset 0 0 8px rgba(77, 166, 255, 0.4);
  transform: translateY(-5px); z-index: 1;
}
.bottle.selected::before {
  content: '▼'; position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
  color: var(--selected-bottle); font-size: 16px; font-weight: bold;
}

.segment {
  width: 100%; height: 25%;
  border-top: 1px dashed rgba(255,255,255,0.1);
  box-sizing: border-box; transition: background-color 0.1s ease;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: rgba(255,255,255,0.7);
}

/* 일반 버튼 스타일 (원래대로 복원) */
.controls-row {
  display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
}
.action-btn {
  background: linear-gradient(180deg, #3d7e56 0%, #1f482f 100%);
  color: #ffe9a9; border: 1px solid #6cb885; padding: .6rem 1.2rem;
  font-size: 0.95rem; border-radius: 18px; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8); transition: all 0.15s ease;
}
.action-btn:hover { background: linear-gradient(180deg, #479265 0%, #265739 100%); border-color: #81cb9a; }
.action-btn:disabled {
  background: #152820; color: #4a6657; border-color: #1c3629; cursor: not-allowed;
  box-shadow: none; text-shadow: none; transform: none !important;
}

.btn-red { background: linear-gradient(180deg, #9e3939 0%, #612525 100%); border-color: #d47373; color: #ffdddd; }
.btn-red:hover { background: linear-gradient(180deg, #b84747 0%, #7a2d2d 100%); }

.btn-orange { background: linear-gradient(180deg, #b87a39 0%, #6b431e 100%); border-color: #d4a373; color: #ffebd0; }
.btn-orange:hover { background: linear-gradient(180deg, #cc8b45 0%, #805124 100%); }

/* '배치 정답 구하기' 버튼만 게임 스타일 및 강조 유지 */
.btn-solve-highlight {
  background: linear-gradient(to bottom, #fce074 0%, #e89823 50%, #c46a06 51%, #df8f15 100%) !important;
  color: #ffffff !important;
  border: 1px solid #ffe89e !important;
  border-radius: 12px 0px 12px 0px !important;
  font-size: 1.1rem !important;
  padding: 0.7rem 1.5rem !important;
  box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.6) !important;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6) !important;
}
.btn-solve-highlight:hover { filter: brightness(1.1); }
.btn-solve-highlight:active { transform: scale(0.97); }

.bottle-count-badge { font-size: 14px; color: var(--accent); font-weight: bold; margin: 0 5px; }

/* 결과창 컨테이너 */
.solution-container {
    display: none;
    margin-top: 20px; 
    background: #091510;
    border: 2px solid var(--line-strong); 
    border-radius: 16px;
    overflow: hidden; 
    box-shadow: 0 10px 30px #000;
}

.tab-control-bar {
    display: flex; 
    background: #12261e; 
    border-bottom: 2px solid var(--line-strong);
}
.tab-btn {
    flex: 1; padding: 12px 0; background: none; border: none;
    color: var(--dim); font-weight: 700; font-size: 14px; cursor: pointer;
    transition: all 0.15s ease; text-align: center; position: relative;
}
.tab-btn:hover { color: var(--accent); background: #ffffff05; }
.tab-btn.active { color: var(--accent); background: #ffffff0a; }
.tab-btn.active::after {
    content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 3px; background: var(--accent); border-radius: 3px 3px 0 0;
}

.solution-content-area { padding: 20px; }

.result-text-panel {
  max-height: none;
  overflow-y: visible;
  display: none;
}
.step-item {
  padding: 12px 15px; border-bottom: 1px solid #173024;
  display: flex; align-items: center; gap: 12px;
  font-size: 1.15rem; font-weight: 600; color: #fff;
}
.step-item:last-child { border-bottom: none; }
.step-num { color: var(--accent); font-weight: 800; min-width: 30px; text-align: right; }
.pour-arrow { color: var(--muted); font-weight: 400; margin: 0 4px; }
.color-dot {
    display: inline-block;
    width: 22px; height: 22px; border-radius: 4px; 
    border: 1px solid rgba(255,255,255,0.4);
    margin-left: auto;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.result-image-panel { 
  display: block; 
  text-align: center; 
  overflow-x: hidden;
  padding: 0;
  width: 100%;
}
#solution-canvas {
    max-width: 100%;
    height: auto;
    background: #091510;
    box-shadow: none;
    border: none;
    border-radius: 8px;
    display: block; 
    margin: 0 auto;
}

.lang-switch {
  background: #12261e; color: var(--accent); border: 1px solid #214032;
  padding: 5px 8px; font-size: 11px; border-radius: 8px; cursor: pointer;
  font-weight: 700; transition: all 0.15s ease; white-space: nowrap;
}
.lang-switch:hover { background: #1d3d2e; }

@media (max-width: 768px) {
    .solution-content-area { padding: 10px; }
}
</style>
</head>
<body>

<nav class="site-navbar">
  <div class="site-nav-inner">
    <a href="#" class="site-nav-brand-link" onclick="resetAll(); return false;">
      <span>
        <span class="site-nav-title" data-i18n="navTitle">개미군단 과일주스</span>
        <span class="site-nav-subtitle">S454 [101]마요 ₍ᵔ.ˬ.ᵔ₎</span>
      </span>
    </a>

    <div class="site-nav-links">
      <a href="https://sualocin.github.io/ant/" class="site-nav-link" data-i18n="navNemo">개미족의 지혜 네모</a>
      <a href="#" class="site-nav-link" onclick="resetAll(); return false;" data-i18n="navReset">초기화</a>
      <button type="button" class="lang-switch" onclick="toggleLanguage()">🇰🇷 / 🇺🇸</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="scale-controls">
    <button type="button" class="scale-btn" onclick="setScale(0.85, this)">85%</button>
    <button type="button" class="scale-btn active" onclick="setScale(1, this)">100%</button>
    <button type="button" class="scale-btn" onclick="setScale(1.15, this)">115%</button>
  </div>

  <div id="zoom-wrapper">
    <div class="card">
      <!-- 이미지 업로드 영역 -->
      <div class="upload-card-section">
        <button type="button" class="upload-btn" onclick="triggerFileUpload()" data-i18n="uploadBtn">
          📷 게임 스크린샷 앨범에서 선택하여 자동 인식
        </button>
        <input type="file" id="image-input" accept="image/*" onchange="processUploadedImage(event)" style="display:none;">
        <div style="font-size: 11px; color: var(--muted); margin-top: 6px;" data-i18n="uploadDesc">
          스크린샷을 선택하면 빈 병 수와 색상('?' 포함)을 자동으로 추출합니다. <br>
        </div>
      </div>

      <!-- 상단 팔레트 -->
      <div class="palette-card-section">
        <div class="instruction-text" id="instruction-text">
          <b>단계 1:</b> 아래 그리드에서 <b style="color:var(--selected-bottle);">입력할 빈 병을 먼저 클릭</b>하세요.
        </div>

        <div class="color-palette" id="palette"></div>

        <div class="custom-color-box">
          <input type="text" id="custom-hex" placeholder="HEX 코드" maxlength="6">
          <button class="btn-sm" onclick="addCustomColor()" data-i18n="btnAddColor">+ 색상 추가</button>
          <button class="btn-sm btn-del" onclick="deleteSelectedPaletteColor()" data-i18n="btnDelColor">- 색상 삭제</button>
        </div>
      </div>

      <!-- 하단 Clear Bottle 그리드 -->
      <div class="bottles-container" id="bottles-container"></div>

      <!-- 컨트롤 버튼 -->
      <div class="controls-row">
        <button class="action-btn btn-red" onclick="removeBottle()" data-i18n="btnRemove">- 삭제</button>
        <span class="bottle-count-badge" id="bottle-count-display">Clear Bottle: 6개</span>
        <button class="action-btn" onclick="addBottle()" data-i18n="btnAdd">+ 추가</button>
        <button class="action-btn btn-orange" id="btn-reset-selected" onclick="resetSelectedBottle()" disabled data-i18n="btnResetSelected">선택 병 비우기</button>
        <button class="action-btn btn-orange" onclick="resetAll()" data-i18n="btnResetAll">전체 초기화</button>
        <!-- 배치 정답 구하기 버튼만 강조 스타일 유지 -->
        <button class="action-btn btn-solve-highlight" onclick="solve()" id="solve-btn" data-i18n="btnSolve">배치 정답 구하기 🚀</button>
      </div>

      <!-- 정답 결과 컨테이너 -->
      <div class="solution-container" id="solution-container">
          <div class="tab-control-bar">
              <button class="tab-btn active" id="tab-btn-image" onclick="setSolutionTab('image')" data-i18n="tabImage">🎨 이미지 답</button>
              <button class="tab-btn" id="tab-btn-text" onclick="setSolutionTab('text')" data-i18n="tabText">📄 텍스트 답</button>
          </div>

          <div class="solution-content-area">
              <div class="result-image-panel" id="solution-output-image">
                  <canvas id="solution-canvas"></canvas>
              </div>

              <div class="result-text-panel" id="solution-output-text"></div>
          </div>
      </div>

    </div>
  </div>
</div>

<script>
let currentLang = 'ko';

const translations = {
  ko: {
    pageTitle: "개미군단 - 과일주스 V12",
    navTitle: "과일주스",
    navNemo: "네모",
    navReset: "초기화",
    uploadBtn: "📷 게임 스크린샷 앨범에서 선택하여 자동 인식",
    uploadDesc: "스크린샷을 선택하면 빈 병 수와 색상('?' 포함)을 자동으로 추출합니다. <br>",
    instruction1: (bottleIdx) => `<b>단계 1:</b> 아래 그리드에서 <b style="color:var(--selected-bottle);">입력할 빈 병을 먼저 클릭</b>하세요.`,
    instruction2: (bottleIdx) => `<b>단계 2:</b> 상단 팔레트에서 <b style="color:var(--accent);">채울 색상을 클릭</b>하여 <b>${bottleIdx + 1}번 Clear Bottle</b>을 채우세요. 모르는 칸은 '?'를 쓰세요.`,
    btnAddColor: "+ 색상 추가",
    btnDelColor: "- 색상 삭제",
    btnRemove: "- 삭제",
    btnAdd: "+ 추가",
    btnResetSelected: "선택 병 비우기",
    btnResetAll: "전체 초기화",
    btnSolve: "배치 정답 구하기 🚀",
    tabImage: "🎨 이미지 답",
    tabText: "📄 텍스트 답",
    bottleCountText: (count) => `Clear Bottle: ${count}개`,
    eraserTitle: "선택된 병의 맨 위 칸 지우기",
    unknownTitle: "모르는 색상 (물음표) 입력",
    customPlaceholder: "HEX 코드",
    customAlert: "6자리 HEX 코드를 입력해주세요. (예: FF0000)",
    delAlert1: "팔레트에서 삭제할 커스텀 색상을 먼저 클릭하여 선택해 주세요.",
    delAlert2: "기본 제공 색상은 삭제할 수 없습니다.",
    delConfirm: (hex) => `#${hex} 색상을 팔레트에서 삭제하시겠습니까?`,
    analysisDone: (count) => `✨ 이미지 분석 완료! 총 ${count}개의 Clear Bottle이 세팅되었습니다.`,
    emptyBottlesWarn: "⚠️ 병이 모두 비어있습니다.",
    engineRunning: "AI 추론 엔진 기동 중... 모르는 색상을 분석하고 풀이를 계산합니다. 🧠",
    inconsistencyErr: (msg) => `<span style="color:#ff5555; font-weight:bold;">❌ AI 추론 실패:</span> 입력된 정보 간에 모순이 발견되었습니다.<br><span style="color:var(--dim);">${msg}</span>`,
    ruleFailErr: (list) => `<span style="color:#ff5555; font-weight:bold;">❌ 풀이 실패 (모순):</span> 추론된 색상 조합이 과일주스 소트 규칙(각 색상 4칸)을 충족하지 못합니다.<br>${list}`,
    alreadySolved: "이미 모든 Clear Bottle이 정리되었습니다! 🎉",
    totalSteps: (count) => `총 ${count}단계 정답 순서:`,

const initialColors = [
  "A21A1A", "CF560D", "DBB06C", "659D5C",

  "F297E4", "58C9C7", "86661B", "959593"
];

let colors = [...initialColors];
let selectedBottleIndex = null;
let selectedPaletteHex = null;
let bottleCount = 6;
let bottlesData = [];

function loadSavedColors() {
  const saved = localStorage.getItem('watersort_custom_colors');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        parsed.forEach(c => {
          if (!colors.includes(c)) colors.push(c);
        });
      }
    } catch(e) {
      console.error("저장된 색상을 불러오는 데 실패했습니다.", e);
    }
  }
}

function saveColorsToStorage() {
  localStorage.setItem('watersort_custom_colors', JSON.stringify(colors));
}

function setScale(scale, btn) {
  const wrapper = document.getElementById("zoom-wrapper");
  wrapper.style.transform = `scale(${scale})`;
  document.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}

function init() {
  loadSavedColors();
  bottlesData = Array.from({ length: bottleCount }, () => []);
  renderPalette();
  renderBottles();
  updateInstructionText();
  updateTexts();
}

function updateInstructionText() {
  const insText = document.getElementById('instruction-text');
  const t = translations[currentLang];
  if (selectedBottleIndex === null) {
    insText.innerHTML = t.instruction1(selectedBottleIndex);
  } else {
    insText.innerHTML = t.instruction2(selectedBottleIndex);
  }
}

function getColorCountsFromBoard() {
  const counts = {};
  bottlesData.forEach(bottle => {
    bottle.forEach(color => {
      if (color !== '?') {
        counts[color] = (counts[color] || 0) + 1;
      }
    });
  });
  return counts;
}

function renderPalette() {
  const paletteEl = document.getElementById('palette');
  paletteEl.innerHTML = '';
  const boardColorCounts = getColorCountsFromBoard();
  const t = translations[currentLang];

  // 지우개
  const eraserWrapper = document.createElement('div');
  eraserWrapper.className = 'color-swatch-wrapper';
  const eraser = document.createElement('div');
  eraser.className = `color-swatch eraser`;
  eraser.innerText = '✕';
  eraser.title = t.eraserTitle;
  eraser.onclick = () => handleColorInput(null);
  eraserWrapper.appendChild(eraser);
  paletteEl.appendChild(eraserWrapper);

  // 물음표
  const unknownWrapper = document.createElement('div');
  unknownWrapper.className = 'color-swatch-wrapper';
  const unknown = document.createElement('div');
  unknown.className = `color-swatch unknown`;
  unknown.innerText = '?';
  unknown.title = t.unknownTitle;
  unknown.onclick = () => handleColorInput('?');
  unknownWrapper.appendChild(unknown);
  paletteEl.appendChild(unknownWrapper);

  // 일반 색상
  colors.forEach(hex => {
    const swatchWrapper = document.createElement('div');
    swatchWrapper.className = 'color-swatch-wrapper';

    const swatch = document.createElement('div');
    swatch.className = `color-swatch`;
    if(["DBB06C", "959593", "F297E4", "58C9C7"].includes(hex)) {
        swatch.classList.add('dark-text');
    }
    if (selectedPaletteHex === hex) {
        swatch.classList.add('selected-color');
    }
    swatch.style.backgroundColor = `#${hex}`;
    swatch.title = `#${hex}`;
    swatch.onclick = () => handleColorInput(hex);

    const count = boardColorCounts[hex] || 0;
    swatch.innerText = count;

    swatchWrapper.appendChild(swatch);
    paletteEl.appendChild(swatchWrapper);
  });
}

function renderBottles() {
  const container = document.getElementById('bottles-container');
  container.innerHTML = '';
  const t = translations[currentLang];

  bottlesData.forEach((bottle, bIdx) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'bottle-wrapper';

    const bottleEl = document.createElement('div');
    bottleEl.className = `bottle ${selectedBottleIndex === bIdx ? 'selected' : ''}`;
    bottleEl.onclick = () => selectTargetBottle(bIdx);

    for (let sIdx = 0; sIdx < 4; sIdx++) {
      const seg = document.createElement('div');
      seg.className = 'segment';
      if (bottle[sIdx]) {
        if (bottle[sIdx] === '?') {
            seg.style.backgroundColor = 'var(--unknown-color)'; 
            seg.innerText = '?';
        } else {
            seg.style.backgroundColor = `#${bottle[sIdx]}`;
            seg.innerText = '';
        }
      } else {
        seg.innerText = '';
      }
      bottleEl.appendChild(seg);
    }

    const num = document.createElement('div');
    num.className = 'bottle-num';
    num.innerText = bIdx + 1;

    wrapper.appendChild(bottleEl);
    wrapper.appendChild(num);
    container.appendChild(wrapper);
  });

  document.getElementById('bottle-count-display').innerText = t.bottleCountText(bottleCount);
  
  const resetSelectedBtn = document.getElementById('btn-reset-selected');
  if (selectedBottleIndex !== null) {
    resetSelectedBtn.removeAttribute('disabled');
  } else {
    resetSelectedBtn.setAttribute('disabled', 'true');
  }
}

function selectTargetBottle(bottleIdx) {
  selectedBottleIndex = (selectedBottleIndex === bottleIdx) ? null : bottleIdx;
  renderBottles(); 
  updateInstructionText();
}

function handleColorInput(hex) {
  selectedPaletteHex = hex;
  renderPalette();

  if (selectedBottleIndex === null) {
    return;
  }

  let bottle = bottlesData[selectedBottleIndex];

  if (hex === null) {
    if (bottle.length > 0) bottle.pop();
  } else {
    if (bottle.length < 4) bottle.push(hex);
  }
  renderBottles(); 
  renderPalette();
}

function addBottle() {
  if (bottleCount < 40) {
    bottleCount++;
    bottlesData.push([]);
    selectedBottleIndex = bottlesData.length - 1;
    renderBottles();
    updateInstructionText();
  }
}

function removeBottle() {
  if (bottleCount > 4) {
    bottleCount--;
    bottlesData.pop();
    if (selectedBottleIndex >= bottleCount) selectedBottleIndex = null;
    renderBottles();
    renderPalette();
    updateInstructionText();
  }
}

function resetSelectedBottle() {
  if (selectedBottleIndex !== null && bottlesData[selectedBottleIndex]) {
    bottlesData[selectedBottleIndex] = [];
    renderBottles();
    renderPalette();
  }
}

function resetAll() {
  bottleCount = 6;

  selectedBottleIndex = null;
  selectedPaletteHex = null;

function deleteSelectedPaletteColor() {

function processUploadedImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const w = img.width;
    const h = img.height;
    const t = translations[currentLang];

    const check13 = checkBottleRimAt(ctx, Math.floor(0.500 * w), Math.floor(0.635 * h));
    const check14 = checkBottleRimAt(ctx, Math.floor(0.428 * w), Math.floor(0.635 * h));

    let layouts = [
      { xPct: 0.141, yBasePct: 0.368 },
      { xPct: 0.285, yBasePct: 0.368 },
      { xPct: 0.428, yBasePct: 0.368 },
      { xPct: 0.572, yBasePct: 0.368 },
      { xPct: 0.715, yBasePct: 0.368 },
      { xPct: 0.859, yBasePct: 0.368 },
      { xPct: 0.141, yBasePct: 0.560 },
      { xPct: 0.285, yBasePct: 0.560 },
      { xPct: 0.428, yBasePct: 0.560 },
      { xPct: 0.572, yBasePct: 0.560 },
      { xPct: 0.715, yBasePct: 0.560 },
      { xPct: 0.859, yBasePct: 0.560 }
    ];

    if (check13) {
      layouts.push({ xPct: 0.500, yBasePct: 0.730 });
    } else if (check14) {
      layouts.push({ xPct: 0.428, yBasePct: 0.730 });
      layouts.push({ xPct: 0.572, yBasePct: 0.730 });
    }

    const segmentGapPct = 0.033;
    let detectedData = [];

    layouts.forEach((pos) => {
      let bottle = [];
      const centerX = Math.floor(pos.xPct * w);

      let rawSegments = [];
      for (let sIdx = 3; sIdx >= 0; sIdx--) {
        const centerY = Math.floor((pos.yBasePct - ((3 - sIdx) * segmentGapPct)) * h);
        
        const sampleSize = 2;
        const imgData = ctx.getImageData(centerX - sampleSize, centerY - sampleSize, sampleSize * 2 + 1, sampleSize * 2 + 1);
        const pixels = imgData.data;

        let rSum = 0, gSum = 0, bSum = 0, count = 0;
        for (let i = 0; i < pixels.length; i += 4) {
          rSum += pixels[i];
          gSum += pixels[i+1];
          bSum += pixels[i+2];
          count++;
        }

        const avgR = rSum / count;
        const avgG = gSum / count;
        const avgB = bSum / count;

        rawSegments.push({ avgR, avgG, avgB, pixels });
      }

      const emptyCount = rawSegments.filter(seg => isTransparentGlassBg(seg.avgR, seg.avgG, seg.avgB, seg.pixels)).length;
      
      if (emptyCount >= 3) {
        detectedData.push([]); 
      } else {
        rawSegments.forEach(seg => {
          if (isTransparentGlassBg(seg.avgR, seg.avgG, seg.avgB, seg.pixels)) {
            return;
          } else if (isQuestionMarkSegment(seg.avgR, seg.avgG, seg.avgB, seg.pixels)) {
            bottle.push('?');
          } else {
            const matchedHex = findClosestColor(seg.avgR, seg.avgG, seg.avgB);
            bottle.push(matchedHex);
          }
        });
        detectedData.push(bottle);
      }
    });

    bottleCount = detectedData.length;
    bottlesData = detectedData;
    selectedBottleIndex = null;

    renderBottles();
    renderPalette();
    updateInstructionText();
    alert(t.analysisDone(bottleCount));
  };

  img.src = URL.createObjectURL(file);
}

function checkBottleRimAt(ctx, x, y) {
  const sample = ctx.getImageData(x - 2, y - 2, 5, 5).data;
  let brightness = 0;
  for (let i = 0; i < sample.length; i += 4) {
    brightness += (sample[i] + sample[i+1] + sample[i+2]) / 3;
  }
  return (brightness / (sample.length / 4)) > 42;
}

function isTransparentGlassBg(r, g, b, pixels) {
  const brightness = (r + g + b) / 3;
  let hasWhiteText = false;
  for (let i = 0; i < pixels.length; i += 4) {
    if (pixels[i] > 195 && pixels[i+1] > 195 && pixels[i+2] > 195) {
      hasWhiteText = true;
      break;
    }
  }
  
  const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);
  return (brightness < 55 && colorDiff < 20 && !hasWhiteText) || brightness < 35;
}

function isQuestionMarkSegment(r, g, b, pixels) {
  const isDarkBrownBg = (r >= 30 && r <= 110) && (g >= 15 && g <= 70) && (b >= 5 && b <= 50);
  
  let hasWhiteText = false;
  for (let i = 0; i < pixels.length; i += 4) {
    if (pixels[i] > 190 && pixels[i+1] > 190 && pixels[i+2] > 190) {
      hasWhiteText = true;
      break;
    }
  }
  return isDarkBrownBg || hasWhiteText;
}

function findClosestColor(r, g, b) {
  let minDistance = Infinity;
  let closestHex = colors[0];

  colors.forEach(hex => {
    const cr = parseInt(hex.substring(0, 2), 16);
    const cg = parseInt(hex.substring(2, 4), 16);
    const cb = parseInt(hex.substring(4, 6), 16);

    const dist = Math.pow(r - cr, 2) + Math.pow(g - cg, 2) + Math.pow(b - cb, 2);
    if (dist < minDistance) {
      minDistance = dist;
      closestHex = hex;
    }
  });

  return closestHex;
}

function inferMissingColors(boardState) {
    const currentState = boardState.map(f => [...f]);
    const knownColorCounts = {};
    const questionMarkPositions = [];
    const colorResiduals = {};

    currentState.forEach((bottle, bIdx) => {
        bottle.forEach((color, sIdx) => {
            if (color === '?') {
                questionMarkPositions.push({bIdx, sIdx});
            } else {
                knownColorCounts[color] = (knownColorCounts[color] || 0) + 1;
            }
        });
    });

    if (questionMarkPositions.length === 0) return currentState;

    const usedColors = [...new Set(currentState.flat().filter(c => c !== '?'))];
    
    usedColors.forEach(color => {
        const remaining = 4 - (knownColorCounts[color] || 0);
        if (remaining > 0) {
            colorResiduals[color] = remaining;
        } else if (remaining < 0) {
            throw new Error(`모순 발생: 색상 #${color}이(가) 이미 ${knownColorCounts[color]}칸 사용되었습니다.`);
        }
    });

    let totalResiduals = Object.values(colorResiduals).reduce((a,b) => a+b, 0);
    if (totalResiduals !== questionMarkPositions.length) {
        throw new Error(`모순 발생: 추론에 필요한 남은 색상 칸 수(${totalResiduals})와 물음표 개수(${questionMarkPositions.length})가 일치하지 않습니다.`);
    }

    const sortedRemainingColors = Object.entries(colorResiduals).sort((a, b) => a[1] - b[1]);
    const resolvedState = currentState.map(f => [...f]);
    const resolvedPositions = new Set();

    sortedRemainingColors.forEach(([color, amount]) => {
        for(let c = 0; c < amount; c++) {
            let bestPosIdx = -1;
            let bestScore = -100;

            questionMarkPositions.forEach((pos, idx) => {
                if (resolvedPositions.has(idx)) return;

                let score = 0;
                if (pos.sIdx > 0) {
                    const colorBelow = resolvedState[pos.bIdx][pos.sIdx - 1];
                    if (colorBelow === color) {
                        score -= 100; 
                    } else if (colorBelow !== '?' && colorBelow !== color) {
                        score -= 10;
                    }
                } else {
                    score += 5;
                }
                
                if (pos.sIdx < 3) {
                    const colorAbove = currentState[pos.bIdx][pos.sIdx + 1];
                    if (colorAbove !== '?' && colorAbove !== color) score -= 40;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestPosIdx = idx;
                }
            });

            if (bestPosIdx !== -1) {
                const pos = questionMarkPositions[bestPosIdx];
                resolvedState[pos.bIdx][pos.sIdx] = color;
                resolvedPositions.add(bestPosIdx);
            } else {
                throw new Error(`모순 발생: 색상 #${color}을(를) 할당할 물음표 칸을 찾을 수 없습니다.`);
            }
        }
    });

    return resolvedState;
}

function solve() {
  selectedBottleIndex = null;
  renderBottles();
  updateInstructionText();

  const container = document.getElementById('solution-container');
  const outputText = document.getElementById('solution-output-text');
  const t = translations[currentLang];
  
  container.style.display = 'block';
  setSolutionTab('image');
  outputText.innerHTML = `<div style="text-align:center; color:var(--accent); padding:20px;">${t.engineRunning}</div>`;

  const initialStateData = bottlesData.map(f => [...f]);

  let totalUnits = initialStateData.flat().length;
  if (totalUnits === 0) {
    outputText.innerHTML = `<span style="color:#ff5555;">${t.emptyBottlesWarn}</span>`;
    setSolutionTab('text');
    return;
  }

  let resolvedStateData;
  try {
      resolvedStateData = inferMissingColors(initialStateData);
  } catch (error) {
      outputText.innerHTML = t.inconsistencyErr(error.message);
      setSolutionTab('text');
      return;
  }

  let colorCounts = {};
  resolvedStateData.forEach(f => {
    f.forEach(c => colorCounts[c] = (colorCounts[c] || 0) + 1);
  });

  const invalidColors = [];
  for (let c in colorCounts) {
    if (colorCounts[c] !== 4) {
        invalidColors.push(`<span class="color-dot" style="background:#${c};"></span>(#${c}, ${colorCounts[c]}칸)`);
    }
  }

  if(invalidColors.length > 0) {
    outputText.innerHTML = t.ruleFailErr(invalidColors.join(', '));
    setSolutionTab('text');
    return;
  }

  function serialize(state) {
    return state.map(f => f.join(',')).sort().join('|');
  }

  function isSolved(state) {
    return state.every(f => f.length === 0 || (f.length === 4 && f.every(c => c === f[0])));
  }

  function getMoveableAmount(state, fromIdx, toIdx) {
    const src = state[fromIdx];
    const dest = state[toIdx];

    if (fromIdx === toIdx || src.length === 0 || dest.length === 4) return 0;
    const color = src[src.length - 1];

    if (dest.length === 0) {
      if (src.every(c => c === color) && src.length === 4) return 0;
      let count = 0;
      for(let i = src.length - 1; i >= 0; i--) {
        if(src[i] === color) count++; else break;
      }
      return count;
    }

    if (dest[dest.length - 1] !== color) return 0;

    let srcContCount = 0;
    for(let i = src.length - 1; i >= 0; i--) {
      if(src[i] === color) srcContCount++; else break;
    }
    return Math.min(srcContCount, 4 - dest.length);
  }

  function makeMove(state, fromIdx, toIdx, amount) {
    const newState = state.map(f => [...f]);
    const src = newState[fromIdx];
    const dest = newState[toIdx];
    for(let i = 0; i < amount; i++) {
      dest.push(src.pop());
    }
    return newState;
  }

  let queue = [{ state: resolvedStateData, path: [] }];
  let visited = new Set([serialize(resolvedStateData)]);
  let foundPath = null;
  const startTime = performance.now();

  while (queue.length > 0) {
    let { state, path } = queue.shift();

    if (isSolved(state)) {
      foundPath = path;
      break;
    }

    if ((performance.now() - startTime) > 7000) break; 

    for (let i = 0; i < state.length; i++) {
      if (state[i].length === 0) continue;
      for (let j = 0; j < state.length; j++) {
        const amount = getMoveableAmount(state, i, j);
        if (amount > 0) {
          const nextState = makeMove(state, i, j, amount);
          const key = serialize(nextState);

          if (!visited.has(key)) {
            visited.add(key);
            queue.push({
              state: nextState,
              path: [...path, { from: i + 1, to: j + 1, color: state[i][state[i].length - 1], amount }]
            });
          }
        }
      }
    }
  }

  if (foundPath) {
    if (foundPath.length === 0) {
      outputText.innerHTML = `<b style="color:var(--accent);">${t.alreadySolved}</b>`;
      setSolutionTab('text');
    } else {
      document.getElementById('solution-container').style.display = 'block';

      let html = `<div style="padding-bottom:10px; border-bottom:2px solid #2a4c3b; margin-bottom:10px;"><b style="color:var(--accent); font-size:1.3rem;">${t.totalSteps(foundPath.length)}</b></div>`;
      foundPath.forEach((step, idx) => {
        html += `<div class="step-item">
          <span class="step-num">${idx+1}.</span>
          <span><b>${step.from}번</b><span class="pour-arrow">➡️</span><b>${step.to}번</b></span>
          <span class="color-dot" style="background:#${step.color};"></span>
        </div>`;
      });
      outputText.innerHTML = html;

      drawVisualSolutionImage(foundPath, resolvedStateData);
      setSolutionTab('image');
    }
  } else {
    document.getElementById('solution-container').style.display = 'block';
    setSolutionTab('text');
    outputText.innerHTML = t.failTimeout;
  }
}

function drawVisualSolutionImage(path, inferredBoardState) {
    const canvas = document.getElementById('solution-canvas');
    const ctx = canvas.getContext('2d');

    const initialState = inferredBoardState.map(f => [...f]);
    const numBottles = inferredBoardState.length;
    const stepsToDisplay = [initialState];

    let currentState = initialState;
    path.forEach(move => {
        const newState = currentState.map(f => [...f]);
        const src = newState[move.from - 1];
        const dest = newState[move.to - 1];
        for(let i = 0; i < move.amount; i++) {
            dest.push(src.pop());
        }
        stepsToDisplay.push(newState);
        currentState = newState;
    });

    const isMobile = window.innerWidth <= 768;

    let UNIT = isMobile ? 1.4 : 0.85;

    const BOTTLE_WIDTH = 32 * UNIT;
    const BOTTLE_GAP_X = 10 * UNIT;
    const INNER_PADDING_X = 20 * UNIT;

    const BOTTLE_HEIGHT = 100 * UNIT;
    const SEGMENT_HEIGHT = BOTTLE_HEIGHT / 4;
    const STEP_PADDING_TOP = 18 * UNIT;
    const STEP_PADDING_BOTTOM = 18 * UNIT;
    const LABEL_AREA_HEIGHT = 32 * UNIT;
    const FINGER_ICON_AREA_HEIGHT = 32 * UNIT;
    const BOTTLE_NUM_LABEL_HEIGHT = 22 * UNIT;

    const ONE_STEP_HEIGHT = STEP_PADDING_TOP + LABEL_AREA_HEIGHT + FINGER_ICON_AREA_HEIGHT + BOTTLE_HEIGHT + BOTTLE_NUM_LABEL_HEIGHT + STEP_PADDING_BOTTOM;
    
    const totalBottlesWidth = (numBottles * BOTTLE_WIDTH) + ((numBottles - 1) * BOTTLE_GAP_X);
    
    const width = isMobile ? totalBottlesWidth + (INNER_PADDING_X * 2) : Math.max(750, totalBottlesWidth + (INNER_PADDING_X * 2));
    const height = stepsToDisplay.length * ONE_STEP_HEIGHT;
    
    canvas.width = width;
    canvas.height = height;

    ctx.fillStyle = '#091510';
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = 'top';

    stepsToDisplay.forEach((boardState, stepIdx) => {
        const stepY = stepIdx * ONE_STEP_HEIGHT;
        
        ctx.fillStyle = '#f3ca65';
        ctx.font = `700 ${18 * UNIT}px "Segoe UI", Arial`;
        ctx.textAlign = 'left';
        ctx.fillText(`#${stepIdx + 1}`, INNER_PADDING_X, stepY + STEP_PADDING_TOP);

        if(stepIdx > 0) {
            ctx.strokeStyle = '#214032';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(10, stepY);
            ctx.lineTo(width - 10, stepY);
            ctx.stroke();
        }

        let currentMove = (stepIdx > 0 && stepIdx <= path.length) ? path[stepIdx - 1] : null;
        const fingerIconY = stepY + STEP_PADDING_TOP + LABEL_AREA_HEIGHT;
        
        const startX = (width - totalBottlesWidth) / 2;

        for (let bottleIdx = 0; bottleIdx < numBottles; bottleIdx++) {
            const bottle = boardState[bottleIdx];
            const bottleX = startX + (bottleIdx * (BOTTLE_WIDTH + BOTTLE_GAP_X));
            const bottleY = fingerIconY + FINGER_ICON_AREA_HEIGHT;

            ctx.strokeStyle = '#6cb885';
            ctx.lineWidth = 2 * UNIT; 
            const radius = 7 * UNIT;
            
            ctx.beginPath();
            ctx.moveTo(bottleX, bottleY);
            ctx.lineTo(bottleX + BOTTLE_WIDTH, bottleY);
            ctx.lineTo(bottleX + BOTTLE_WIDTH, bottleY + BOTTLE_HEIGHT - radius);
            ctx.quadraticCurveTo(bottleX + BOTTLE_WIDTH, bottleY + BOTTLE_HEIGHT, bottleX + BOTTLE_WIDTH - radius, bottleY + BOTTLE_HEIGHT);
            ctx.lineTo(bottleX + radius, bottleY + BOTTLE_HEIGHT);
            ctx.quadraticCurveTo(bottleX, bottleY + BOTTLE_HEIGHT, bottleX, bottleY + BOTTLE_HEIGHT - radius);
            ctx.closePath();
            
            ctx.fillStyle = 'rgba(10, 23, 17, 0.8)';
            ctx.fill();
            ctx.stroke();

            const innerBottleX = bottleX + ctx.lineWidth;
            const innerBottleY = bottleY;
            const innerBottleWidth = BOTTLE_WIDTH - ctx.lineWidth * 2;
            const innerBottleHeight = BOTTLE_HEIGHT;

            for (let segIdx = 0; segIdx < 4; segIdx++) {
                const colorHex = bottle[segIdx];
                if (colorHex) {
                    ctx.fillStyle = `#${colorHex}`;
                    const segY = innerBottleY + innerBottleHeight - ((segIdx + 1) * SEGMENT_HEIGHT);
                    
                    if(segIdx === 0) {
                        ctx.beginPath();
                        ctx.moveTo(innerBottleX, segY);
                        ctx.lineTo(innerBottleX + innerBottleWidth, segY);
                        ctx.lineTo(innerBottleX + innerBottleWidth, innerBottleY + innerBottleHeight - radius);
                        ctx.quadraticCurveTo(innerBottleX + innerBottleWidth, innerBottleY + innerBottleHeight, innerBottleX + innerBottleWidth - radius, innerBottleY + innerBottleHeight);
                        ctx.lineTo(innerBottleX + radius, innerBottleY + innerBottleHeight);
                        ctx.quadraticCurveTo(innerBottleX, innerBottleY + innerBottleHeight, innerBottleX, innerBottleY + innerBottleHeight - radius);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.fillRect(innerBottleX, segY, innerBottleWidth, SEGMENT_HEIGHT);
                    }

                    if(segIdx < 3) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                        ctx.lineWidth = 1 * UNIT;
                        ctx.beginPath();
                        ctx.moveTo(innerBottleX + 3, segY);
                        ctx.lineTo(innerBottleX + innerBottleWidth - 3, segY);
                        ctx.stroke();
                    }
                }
            }

            if(currentMove) {
                ctx.font = `${24 * UNIT}px "Segoe UI", Arial`;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                
                if (bottleIdx === currentMove.from - 1) {
                    ctx.fillText('👆', bottleX + BOTTLE_WIDTH / 2, fingerIconY + 6 * UNIT);
                } else if (bottleIdx === currentMove.to - 1) {
                    ctx.fillText('👇', bottleX + BOTTLE_WIDTH / 2, fingerIconY + 6 * UNIT);
                }
            }

            if (bottle.length === 4 && bottle.every(c => c === bottle[0])) {
                ctx.font = `${22 * UNIT}px "Segoe UI", Arial`;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                ctx.fillText('👑', bottleX + BOTTLE_WIDTH / 2, bottleY - 24 * UNIT);
            }

            ctx.fillStyle = '#fff';
            ctx.font = `800 ${15 * UNIT}px "Segoe UI", Arial`; 
            ctx.textAlign = 'center';
            const textY = bottleY + BOTTLE_HEIGHT + 6 * UNIT;
            ctx.fillText(bottleIdx + 1, bottleX + BOTTLE_WIDTH / 2, textY);
        }
    });
}

window.onload = init;
</script>
