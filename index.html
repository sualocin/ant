<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개미군단 - Standalone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06110c;--bg-soft:#0d1d16;--card:#0f221b;--card2:#152b21;
  --text:#e4ede7;--muted:#8ea89b;--dim:#5e786a;--line:#214032;
  --line-strong:#39614c;--accent:#f3ca65;--orange:#e67e22;
}
html,body{min-height:100%;background:radial-gradient(circle at 50% 30%, #11261d 0%, #050e0a 100%);color:var(--text)}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  line-height:1.5;overflow-x:hidden;
}
button,input{font:inherit}
.site-navbar{
  position:sticky;top:0;z-index:20;background:#0c1c15f0;
  border-bottom:1px solid #214233;backdrop-filter:blur(14px);
}
.site-nav-inner{
  width:min(1200px,100%);margin:auto;min-height:58px;padding:8px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.site-nav-brand-link{display:flex;align-items:center;gap:9px;color:var(--accent);text-decoration:none}
.site-nav-title{font-size:18px;font-weight:700;letter-spacing:.04em;color:#f3ca65}
.site-nav-subtitle{font-size:10px;color:var(--muted);display:block;line-height:1}
.site-nav-links{display:flex;align-items:center;gap:6px}
.site-nav-link,.site-nav-dropdown-toggle{
  color:#d0e3d7;text-decoration:none;border:0;background:transparent;
  padding:8px 11px;border-radius:8px;cursor:pointer;font-size:14px;
}
.site-nav-link:hover,.site-nav-dropdown-toggle:hover{background:#ffffff0f}
.site-nav-link.active{color:var(--accent);background:#ffffff0a}
.site-nav-dropdown{position:relative}
.site-nav-dropdown-content{
  position:absolute;right:0;top:calc(100% + 6px);min-width:180px;
  padding:6px;background:#12261e;border:1px solid var(--line-strong);
  border-radius:10px;box-shadow:0 12px 35px #000b;display:none;
}
.site-nav-dropdown-content.open{display:block}
.site-nav-dropdown-link{
  display:block;color:#d0e3d7;text-decoration:none;padding:8px 10px;border-radius:7px;font-size:13px;
}
.site-nav-dropdown-link:hover{background:#ffffff0d}
.site-mobile-menu-toggle{display:none;background:none;border:0;color:white}
.container{width:min(1200px,100%);margin:auto;padding:18px 16px 35px}

/* 화면 크기 스케일 조절 전용 컨테이너 */
#zoom-wrapper{
  width:100%;
  transform-origin: top center;
  transition: transform 0.2s ease, width 0.2s ease;
}

/* 화면 크기 조절 컨트롤 버튼 스타일 */
.scale-controls{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;
}
.scale-btn{
  background:#12261e;color:#8ea89b;border:1px solid #214032;
  padding:4px 12px;font-size:12px;border-radius:12px;cursor:pointer;
  transition:all 0.15s ease;
}
.scale-btn:hover{background:#1d3d2e;color:#ffe9a9}
.scale-btn.active{background:#284c3a;color:#f3ca65;border-color:#3d7e56;font-weight:700}

.card{
  width:min(650px,100%);margin:auto;background:var(--card);
  border:1px solid #2a4c3b;border-radius:20px;padding:16px;
  box-shadow:0 10px 40px #000b, inset 0 0 15px rgba(0,0,0,0.6);
}
#for-aspect-ratio{width:min(92vw,520px);max-width:100%;margin:auto;display:flex;flex-direction:column;gap:10px}
#score{
  text-align:center;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;margin-bottom:2px;
  color:var(--accent);text-shadow:0 0 12px rgba(243,202,101,0.4);
}
#score::before{content:"포인트: ";font-size:0.7em;color:#b8a374;font-weight:500;}
#game-table-container{width:100%;display:flex;flex-direction:column;gap:12px}
#game-board{
  border-collapse:collapse;table-layout:fixed;background:#0a1711;
  border:3px solid #6b8a61;outline:2px solid #233e31;
  margin:0 auto;width:100%;aspect-ratio:1;box-shadow:0 0 25px rgba(10,40,25,0.9), inset 0 0 20px #000;
  touch-action:none;user-select:none;-webkit-user-select:none;
  border-radius:4px;
}
#game-board td{
  width:11.11%;height:11.11%;border:1px solid #1a3328;
  padding:0;cursor:pointer;transition:background .08s,outline .08s;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
/* 3×3 구역 교차 색상 */
#game-board tr:nth-child(-n+3) td:nth-child(-n+3),
#game-board tr:nth-child(-n+3) td:nth-child(n+7),
#game-board tr:nth-child(n+7) td:nth-child(-n+3),
#game-board tr:nth-child(n+7) td:nth-child(n+7),
#game-board tr:nth-child(n+4):nth-child(-n+6) td:nth-child(n+4):nth-child(-n+6){background:#10221a}

#game-board tr:nth-child(-n+3) td:nth-child(n+4):nth-child(-n+6),
#game-board tr:nth-child(n+4):nth-child(-n+6) td:nth-child(-n+3),
#game-board tr:nth-child(n+4):nth-child(-n+6) td:nth-child(n+7),
#game-board tr:nth-child(n+7) td:nth-child(n+4):nth-child(-n+6){background:#162c22}

/* 보드 상의 기존 통일 블록 색상 */
#game-board td.has-piece{
  background: linear-gradient(135deg, #4b6354, #2c3e34) !important;
  border: 1px solid #5c7867 !important;
  box-shadow: inset 1px 1px 2px #7a9c87, 0 0 5px rgba(0,0,0,0.5);
}

/* ========================================================= */
/* [신규 고대비 색상 정의] - 1:빨강 / 2:노랑 / 3:파랑            */
/* ========================================================= */
/* 1. 빨강 (Red) */
#game-board td.color-0, #piece-on-deck-0 td.has-piece{
  background: linear-gradient(135deg, #ff3366, #ba000d) !important;
  border: 1px solid #800000 !important;
  box-shadow: inset 1px 1px 2px #ffb3c1, 0 0 8px rgba(255, 51, 102, 0.6);
}

/* 2. 노랑 (Yellow) */
#game-board td.color-1, #piece-on-deck-1 td.has-piece{
  background: linear-gradient(135deg, #ffea00, #ff9100) !important;
  border: 1px solid #b26a00 !important;
  box-shadow: inset 1px 1px 2px #fff9c4, 0 0 8px rgba(255, 234, 0, 0.7);
}

/* 3. 파랑 (Blue) */
#game-board td.color-2, #piece-on-deck-2 td.has-piece{
  background: linear-gradient(135deg, #00d2ff, #0040ff) !important;
  border: 1px solid #002699 !important;
  box-shadow: inset 1px 1px 2px #b3f0ff, 0 0 8px rgba(0, 210, 255, 0.6);
}

/* 줄 삭제 시 0.5초 동안 강조되는 황금색 이펙트 */
#game-board td.solution-line{
  background: linear-gradient(135deg, #ffffff, #ffe066) !important;
  border: 1px solid #ffaa00 !important;
  box-shadow: inset 0 0 10px #fff, 0 0 20px #ffea00 !important;
  animation: pulse 0.25s infinite alternate;
}

#pieces-on-deck-container{
  display:flex;width:100%;aspect-ratio:3/1;min-height:72px;gap:8px;
  user-select:none;-webkit-user-select:none;
}
table.pieces-on-deck{
  border-collapse:collapse;table-layout:fixed;border-spacing:0;width:33.33%;
  border:1px solid #284c3a;background:#091510;aspect-ratio:1;
  touch-action:none;user-select:none;-webkit-user-select:none;
  border-radius:8px;box-shadow:inset 0 0 8px #000;
}
table.pieces-on-deck td{
  width:20%;height:20%;padding:0;border:1px solid #173024;
  cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
}

#pause-button-container{display:flex;justify-content:center;text-align:center;gap:10px;margin-top:6px}
#pause-button, #undo-button{
  background:linear-gradient(180deg, #3d7e56 0%, #1f482f 100%);
  color:#ffe9a9;border:1px solid #6cb885;padding:.75rem 1.5rem;
  font-size:1.1rem;border-radius:22px;cursor:pointer;font-weight:700;
  min-height:48px;min-width:130px;
  box-shadow:0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  text-shadow:0 1px 2px rgba(0,0,0,0.8);
  transition:all 0.15s ease;
}
#undo-button{
  background:linear-gradient(180deg, #39527a 0%, #1d2c47 100%);
  color:#d0e3d7;border-color:#5678ab;
}
#pause-button:hover{
  background:linear-gradient(180deg, #479265 0%, #265739 100%);
  border-color:#81cb9a;
  box-shadow:0 4px 18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.35);
}
#undo-button:hover{
  background:linear-gradient(180deg, #46639e 0%, #253961 100%);
  border-color:#739ad4;
  box-shadow:0 4px 18px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.35);
}
#pause-button.active, #undo-button:active{
  opacity: 0.8;
  transform: translateY(1px);
}
.footer{text-align:center;font-size:13px;color:var(--dim);margin-top:4px}
#speed-container{display:flex;align-items:center;justify-content:center;gap:9px}
.speed-icon{font-size:21px;color:#38614c}
#speed{width:min(70%,280px);height:36px;min-width:120px;accent-color:#3d7e56}
.help{
  margin-top:10px;color:#708d7e;font-size:12px;text-align:center;
}
.result{
  margin-top:9px;text-align:center;color:#f3ca65;font-size:13px;min-height:18px;font-weight:500;
}
@media (hover:hover) and (pointer:fine){
  #game-board td:hover,table.pieces-on-deck td:hover{outline:2px solid #f3ca65aa;outline-offset:-2px}
}
@media(max-width:768px){
  .site-nav-inner{min-height:52px;padding:7px 11px}
  .site-nav-links{display:none}
  .site-mobile-menu-toggle{display:flex;flex-direction:column;gap:4px;padding:6px}
  .site-mobile-menu-toggle span{display:block;width:24px;height:2px;background:#d0e3d7}
  .site-mobile-menu-toggle.active + .site-nav-links{
    display:flex;position:absolute;top:52px;left:8px;right:8px;flex-direction:column;
    align-items:stretch;padding:8px;background:#12261e;border:1px solid var(--line-strong);
    border-radius:10px;box-shadow:0 12px 30px #0009;
  }
  .site-nav-link,.site-nav-dropdown-toggle{text-align:left;width:100%}
  .site-nav-dropdown-content{position:static;margin-top:4px}
  .container{padding:10px 7px 20px}
  .card{padding:10px;border-radius:14px}
  #for-aspect-ratio{width:min(96vw,620px)}
  #game-board{border-width:2px}
  #pieces-on-deck-container{min-height:88px}
  #pause-button-container{width:100%}
  #pause-button, #undo-button{flex:1;min-width:0;padding:.75rem .5rem}
  #speed{width:100%;flex:1}
}
</style>
</head>
<body>

<div class="container">
  <!-- 크기 축소/확대 버튼 영역 -->
  <div class="scale-controls">
    <button type="button" class="scale-btn" onclick="setScale(0.7, this)">70%</button>
    <button type="button" class="scale-btn" onclick="setScale(0.85, this)">85%</button>
    <button type="button" class="scale-btn active" onclick="setScale(1, this)">100%</button>
  </div>

  <div id="zoom-wrapper">
    <div class="card">
      <div id="for-aspect-ratio">
        <div id="score">0</div>
        <div id="game-table-container">
          <table id="game-board" title="게임판. 클릭하거나 드래그해서 블록을 입력하세요.">
            <tbody id="board-body"></tbody>
          </table>

          <div id="pieces-on-deck-container" title="5×5 입력판. 클릭하거나 드래그해서 도형을 만드세요.">
            <table class="pieces-on-deck" id="piece-on-deck-0"><tbody></tbody></table>
            <table class="pieces-on-deck" id="piece-on-deck-1"><tbody></tbody></table>
            <table class="pieces-on-deck" id="piece-on-deck-2"><tbody></tbody></table>
          </div>
        </div>

        <div id="pause-button-container">
          <button id="pause-button">배치</button>
          <button id="undo-button">다시보기</button>
        </div>

        <div class="footer">
          <div id="speed-container">
            <span class="speed-icon">◉</span>
            <input title="표시 속도" name="speed" type="range" id="speed" min="1" max="10" value="1">
          </div>

        <div class="help">보드와 3개의 도형을 입력한 뒤 <b>배치</b>를 누르면 추천 배치를 적용합니다.</div>

<script>
// 화면 전체 축소/확대 함수
function setScale(scale, btn) {
  const wrapper = document.getElementById("zoom-wrapper");
  wrapper.style.transform = `scale(${scale})`;
  
  document.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");
}

// === BITBOARD FUNCTIONS
const USED_BITS = 0x7FFFFFF;
const ROW_0 = 0x1FF;
const ROW_2 = ROW_0 << 18;
const LEFT_BITS = 1 | (1 << 9) | (1 << 18);
const RIGHT_BITS = LEFT_BITS << 8;
const TOP_LEFT_CUBE = 0x7 | (0x7 << 9) | (0x7 << 18);

const INF_SCORE = 9999999;
function bitboard(a, b, c) {
    return { a: a, b: b, c: c };
}

function getEmpty() {
    return bitboard(0, 0, 0)
}
function getFull() {
    return bitboard(USED_BITS, USED_BITS, USED_BITS);
}
function copy(bb) {
    return bitboard(bb.a, bb.b, bb.c);
}

const EMPTY = getEmpty();
const FULL = getFull();

function _popcount(x) {
    x -= x >> 1 & 0x55555555
    x = (x & 0x33333333) + (x >> 2 & 0x33333333)
    x = x + (x >> 4) & 0x0f0f0f0f
    x += x >> 8
    x += x >> 16
    return x & 0x7f
}

function count(bb) {
    return _popcount(bb.a) + _popcount(bb.b) + _popcount(bb.c);
}

function compare(a, b) {
    return a.a - b.a || a.b - b.b || a.c - b.c;
}

function equal(a, b) {
    return a.a === b.a && a.b === b.b && a.c === b.c;
}

function any(bb) {
    return bb.a + bb.b + bb.c !== 0;
}
function is_empty(bb) {
    return !any(bb);
}

function not(bb) {
    return bitboard(~bb.a & USED_BITS, ~bb.b & USED_BITS, ~bb.c & USED_BITS);
}

function and(a, b) {
    return bitboard(a.a & b.a, a.b & b.b, a.c & b.c);
}
function is_disjoint(a, b) {
    return (a.a & b.a) === 0 && (a.b & b.b) === 0 && (a.c & b.c) === 0;
}
function count_intersection(a, b) {
    return _popcount(a.a & b.a) + _popcount(a.b & b.b) + _popcount(a.c & b.c);
}
function count_diff(a, b) {
    return _popcount(a.a & ~b.a) + _popcount(a.b & ~b.b) + _popcount(a.c & ~b.c);
}
function or(a, b) {
    return bitboard(a.a | b.a, a.b | b.b, a.c | b.c);
}
function xor(a, b) {
    return and(or(a, b), not(and(a, b)));
}
function diff(a, b) {
    return bitboard(a.a & ~b.a, a.b & ~b.b, a.c & ~b.c);
}
function is_subset(a/*superset*/, b) {
    return (b.a & ~a.a) === 0 && (b.b & ~a.b) === 0 && (b.c & ~a.c) === 0;
}
function bit(r, c) {
    return and(row(r), column(c));
}
function at(bb, r, c) {
    return !is_empty(and(bit(r, c), bb));
}

function _row(r) {
    const result = [0, 0, 0];
    const m = r % 3;
    result[(r - m) / 3] = ROW_0 << (m * 9);
    return bitboard(...result);
}
const ROWS = Array.from({ length: 10 }, (_, i) => _row(i));
function row(r) {
    return ROWS[r];
}

function _column(c) {
    return bitboard(LEFT_BITS << c, LEFT_BITS << c, LEFT_BITS << c);
}
const COLS = Array.from({ length: 10 }, (_, i) => _column(i));
function column(c) {
    return COLS[c];
}

function _cube(i) {
    const result = [0, 0, 0];
    result[Math.floor(i / 3)] = TOP_LEFT_CUBE << ((i % 3) * 3);
    return bitboard(...result);
}
const CUBES = Array.from({ length: 10 }, (_, i) => _cube(i));
function cube(i) {
    return CUBES[i];
}

function shift_right(bb) {
    return bitboard((bb.a & ~RIGHT_BITS) << 1, (bb.b & ~RIGHT_BITS) << 1, (bb.c & ~RIGHT_BITS) << 1);
}

function shift_left(bb) {
    return bitboard((bb.a & ~LEFT_BITS) >> 1, (bb.b & ~LEFT_BITS) >> 1, (bb.c & ~LEFT_BITS) >> 1);
}

function shift_down(bb) {
    return bitboard(
        (bb.a << 9) & USED_BITS,
        ((bb.b << 9) | ((bb.a & ROW_2) >> 18)) & USED_BITS,
        ((bb.c << 9) | ((bb.b & ROW_2) >> 18)) & USED_BITS,
    );
}
function shift_up(bb) {
    return bitboard(
        (bb.a >> 9) | ((bb.b & ROW_0) << 18),
        (bb.b >> 9) | ((bb.c & ROW_0) << 18),
        bb.c >> 9,
    );
}

// === PIECES
const PIECES = [
    bitboard(1, 0, 0),
    bitboard(3, 0, 0),
    bitboard(513, 0, 0),
    bitboard(1025, 0, 0),
    bitboard(514, 0, 0),
    bitboard(7, 0, 0),
    bitboard(262657, 0, 0),
    bitboard(1049601, 0, 0),
    bitboard(263172, 0, 0),
    bitboard(515, 0, 0),
    bitboard(1537, 0, 0),
    bitboard(1538, 0, 0),
    bitboard(1027, 0, 0),
    bitboard(15, 0, 0),
    bitboard(262657, 1, 0),
    bitboard(1539, 0, 0),
    bitboard(786945, 0, 0),
    bitboard(3588, 0, 0),
    bitboard(525315, 0, 0),
    bitboard(519, 0, 0),
    bitboard(262659, 0, 0),
    bitboard(2055, 0, 0),
    bitboard(787458, 0, 0),
    bitboard(3585, 0, 0),
    bitboard(3586, 0, 0),
    bitboard(263681, 0, 0),
    bitboard(525826, 0, 0),
    bitboard(1031, 0, 0),
    bitboard(3075, 0, 0),
    bitboard(263682, 0, 0),
    bitboard(525825, 0, 0),
    bitboard(1542, 0, 0),
    bitboard(31, 0, 0),
    bitboard(262657, 513, 0),
    bitboard(265729, 0, 0),
    bitboard(525319, 0, 0),
    bitboard(1836034, 0, 0),
    bitboard(1052164, 0, 0),
    bitboard(2567, 0, 0),
    bitboard(787459, 0, 0),
    bitboard(786947, 0, 0),
    bitboard(3589, 0, 0),
    bitboard(262663, 0, 0),
    bitboard(1050631, 0, 0),
    bitboard(1837060, 0, 0),
    bitboard(1835521, 0, 0),
    bitboard(527874, 0, 0),
];

function rotate(bb) {
    let result = EMPTY;
    for (let r = 0; r < 9; ++r) {
        for (let c = 0; c < 9; ++c) {
            if (at(bb, r, c)) {
                const rotated_r = c;
                const rotated_c = 8 - r;
                result = or(result, bit(rotated_r, rotated_c));
            }
        }
    }
    return result;
}

function mirror(bb) {
    let result = EMPTY;
    for (let r = 0; r < 9; ++r) {
        for (let c = 0; c < 9; ++c) {
            if (at(bb, r, c)) {
                result = or(result, bit(r, 8 - c));
            }
        }
    }
    return result;
}

function get_all_transformations(bb) {
    const transformations = [];
    let rotated = bb;
    for (let i = 0; i < 4; ++i) {
        rotated = rotate(rotated);
        const mirrored = mirror(rotated);
        transformations.push(rotated);
        transformations.push(mirrored);
    }
    return transformations;
}

function perform_clears(board) {
    let to_remove = EMPTY;
    for (let i = 0; i < 9; ++i) {
        const c = column(i);
        if (is_subset(board, c)) {
            to_remove = or(to_remove, c);
        }
        const r = row(i);
        if (is_subset(board, r)) {
            to_remove = or(to_remove, r);
        }
        const cb = cube(i);
        if (is_subset(board, cb)) {
            to_remove = or(to_remove, cb);
        }
    }
    if (is_empty(to_remove)) {
        return board;
    }
    return diff(board, to_remove);
}

function get_next_boards(board, p, clears_first = false) {
    if (is_empty(p)) {
        return [{ placement: p, board: board }];
    }
    let result = [];
    let left = p;
    const col8 = column(8);
    const row8 = row(8);
    while (true) {
        if (is_disjoint(board, p)) {
            result.push({ placement: p, board: perform_clears(or(board, p)) });
        }
        if (!is_disjoint(p, col8)) {
            if (!is_disjoint(left, row8)) {
                break;
            }
            left = shift_down(left);
            p = left;
        } else {
            p = shift_right(p);
        }
    }
    function is_clear(placement_pair) {
        return is_subset(placement_pair.board, placement_pair.placement);
    }
    if (clears_first) {
        result.sort((a, b) => is_clear(b) - is_clear(a));
    }
    return result;
}

const EDGES = or(or(column(0), column(8)), or(row(0), row(8)));
const ALIGNED_BLOCKED_UP = or(row(3), row(6));
const ALIGNED_BLOCKED_DOWN = or(row(2), row(5));
const ALIGNED_BLOCKED_LEFT = or(column(3), column(6));
const ALIGNED_BLOCKED_RIGHT = or(column(2), column(5));

function get_eval(bb, max = INF_SCORE) {
    const OCCUPIED_SIDE_SQUARE = 2000;
    const OCCUPIED_CENTER_SQUARE = 1607;
    const OCCUPIED_CORNER_SQUARE = 3067;

    const SIDE_CUBE = 1358;
    const CORNER_CUBE = 908;
    const CENTER_CUBE = 204;

    const SQUASHED_EMPTY_MIDDLE = 524;
    const SQUASHED_EMPTY_EDGE = 3386;

    const ALTERNATING_UNALIGNED = 4450;
    const ALTERNATING_ALIGNED = 1776;

    const CORNERED_EMPTY = 6540;
    const DEADLY_PIECE = 18185;
    const THREE_BAR = 2665;

    let result = 0;

    for (let i = 0; i < 9; ++i) {
        const cb = and(cube(i), bb);
        if (any(cb)) {
            const cnt = count(cb);
            if (i == 4) {
                result += CENTER_CUBE;
                result += OCCUPIED_CENTER_SQUARE * cnt;
            } else if (i === 1 || i === 3 || i === 5 || i === 7) {
                result += SIDE_CUBE;
                result += OCCUPIED_SIDE_SQUARE * cnt;
            } else {
                result += CORNER_CUBE;
                result += OCCUPIED_CORNER_SQUARE * cnt;
            }
        }
    }
    if (result >= max) return max;

    const open = not(bb);
    const blocked_up = diff(open, shift_down(open));
    const blocked_left = diff(open, shift_right(open));
    const blocked_right = diff(open, shift_left(open));
    const blocked_down = diff(open, shift_up(open));

    result += (count_diff(blocked_up, ALIGNED_BLOCKED_UP) - 9) * ALTERNATING_UNALIGNED;
    result += count_intersection(blocked_up, ALIGNED_BLOCKED_UP) * ALTERNATING_ALIGNED;

    result += (count_diff(blocked_left, ALIGNED_BLOCKED_LEFT) - 9) * ALTERNATING_UNALIGNED;
    result += count_intersection(blocked_left, ALIGNED_BLOCKED_LEFT) * ALTERNATING_ALIGNED;

    result += (count_diff(blocked_right, ALIGNED_BLOCKED_RIGHT) - 9) * ALTERNATING_UNALIGNED;
    result += count_intersection(blocked_right, ALIGNED_BLOCKED_RIGHT) * ALTERNATING_ALIGNED;

    result += (count_diff(blocked_down, ALIGNED_BLOCKED_DOWN) - 9) * ALTERNATING_UNALIGNED;
    result += count_intersection(blocked_down, ALIGNED_BLOCKED_DOWN) * ALTERNATING_ALIGNED;

    if (result >= max) return max;

    const squashed_verticle = and(blocked_down, blocked_up);
    result += count_diff(squashed_verticle, EDGES) * SQUASHED_EMPTY_MIDDLE;
    result += count_intersection(squashed_verticle, EDGES) * SQUASHED_EMPTY_EDGE;

    const squashed_horizontal = and(blocked_left, blocked_right);
    result += count_diff(squashed_horizontal, EDGES) * SQUASHED_EMPTY_MIDDLE;
    result += count_intersection(squashed_horizontal, EDGES) * SQUASHED_EMPTY_EDGE;

    result += count_diff(and(blocked_up, blocked_left), or(row(0), column(0))) * CORNERED_EMPTY;
    result += count_diff(and(blocked_up, blocked_right), or(row(0), column(8))) * CORNERED_EMPTY;
    result += count_diff(and(blocked_down, blocked_left), or(row(8), column(0))) * CORNERED_EMPTY;
    result += count_diff(and(blocked_down, blocked_right), or(row(8), column(8))) * CORNERED_EMPTY;

    if (result >= max) return max;

    const open_left = shift_right(open);
    const open_2_left = shift_right(open_left);
    const open_right = shift_left(open);
    const open_2_right = shift_left(open_right);
    const open_up = shift_down(open);
    const open_2_up = shift_down(open_up);
    const open_down = shift_up(open);
    const open_2_down = shift_up(open_down);

    const open_up_left = shift_right(open_up);
    const open_down_left = shift_right(open_down);
    const open_up_right = shift_left(open_up);
    const open_down_right = shift_left(open_down);

    const open_and_open_left = and(open, open_left);
    const open_and_open_right = and(open, open_right);
    const open_and_open_up = and(open, open_up);
    const open_and_open_down = and(open, open_down);

    let fillable_by_horizontal_3_bar =
        or(and(open_and_open_left, open_right), or(and(open_and_open_left, open_2_left), and(open_and_open_right, open_2_right)));
    result += count_intersection(open, not(fillable_by_horizontal_3_bar)) * THREE_BAR;

    let fillable_by_verticle_3_bar = or(and(open_and_open_up, open_down), or(and(open_and_open_up, open_2_up), and(open_and_open_down, open_2_down)));
    result += count_intersection(open, not(fillable_by_verticle_3_bar)) * THREE_BAR;

    if (result >= max) return max;

    const open_and_open_2_left = and(open, open_2_left);
    const open_and_open_2_right = and(open, open_2_right);
    const open_and_open_2_up = and(open, open_2_up);
    const open_and_open_2_down = and(open, open_2_down);

    if (is_disjoint(and(open_and_open_left, open_and_open_2_left), and(open_and_open_right, open_and_open_2_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_up, open_and_open_2_up), and(open_and_open_down, open_and_open_2_down))) {
        result += DEADLY_PIECE;
    }

    if (is_disjoint(and(open_and_open_up, open_and_open_2_up), and(open_and_open_right, open_and_open_2_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_up, open_and_open_2_up), and(open_and_open_left, open_and_open_2_left))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_down, open_and_open_2_down), and(open_and_open_right, open_and_open_2_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_down, open_and_open_2_down), and(open_and_open_left, open_and_open_2_left))) {
        result += DEADLY_PIECE;
    }

    if (is_disjoint(and(open_and_open_left, open_and_open_right), and(open_and_open_down, open_and_open_2_down))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_left, open_and_open_right), and(open_and_open_up, open_and_open_2_up))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_up, open_and_open_down), and(open_and_open_left, open_and_open_2_left))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_up, open_and_open_down), and(open_and_open_right, open_and_open_2_right))) {
        result += DEADLY_PIECE;
    }

    if (is_disjoint(and(open_and_open_left, open_and_open_right), and(open_and_open_up, open_and_open_down))) {
        result += DEADLY_PIECE;
    }

    if (is_disjoint(open, and(open_down_left, open_up_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(open, and(open_up_left, open_down_right))) {
        result += DEADLY_PIECE;
    }

    if (is_disjoint(and(open_and_open_up, open_and_open_down), and(open_up_right, open_down_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_up, open_and_open_down), and(open_up_left, open_down_left))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_left, open_and_open_right), and(open_up_left, open_up_right))) {
        result += DEADLY_PIECE;
    }
    if (is_disjoint(and(open_and_open_left, open_and_open_right), and(open_down_left, open_down_right))) {
        result += DEADLY_PIECE;
    }

    return result;
}

function get_combo_magnitude(mid_clear) {
    let result = 0;
    for (let i = 0; i < 9; ++i) {
        if (equal(row(i), and(row(i), mid_clear))) result += 1;
        if (equal(column(i), and(column(i), mid_clear))) result += 1;
        if (equal(cube(i), and(cube(i), mid_clear))) result += 1;
    }
    return result;
}

function get_move_score(previous_was_clear, prev, placement, after) {
    let result = count(diff(after, prev));
    const combo = get_combo_magnitude(or(prev, placement));
    if (combo === 0) return result;

    if (previous_was_clear) result += 9;

    if (combo <= 2) result += 18 * combo;
    else if (combo <= 4) result += 36 * combo;
    else if (combo <= 7) result += 54 * combo;
    else result += 72 * combo;

    return result;
}

function* get_piece_set_permutations_optimized(board, piece_set) {
    piece_set = [...piece_set];
    piece_set.sort(compare);
    yield piece_set;
    if (!can_clear_with_2_pieces(board, piece_set)) return;
    const [a, b, c] = piece_set;
    if (!equal(b, c)) yield [a, c, b];
    if (!equal(a, b)) yield [b, a, c];
    if (!equal(a, c) && !equal(a, b)) yield [b, c, a];
    if (!equal(b, c) && !equal(a, c)) yield [c, a, b];
    if (!equal(a, c) && !equal(a, b) && !equal(b, c)) yield [c, b, a];
}

function* get_all_piece_set_permutations(piece_set) {
    const [a, b, c] = piece_set;
    yield [a, b, c];
    yield [a, c, b];
    yield [b, a, c];
    yield [b, c, a];
    yield [c, a, b];
    yield [c, b, a];
}

function can_clear_with_2_pieces(board, piece_set) {
    for (let i = 0; i < 3; ++i) {
        const p0 = piece_set[i];
        for (let { board: after_p0 } of get_next_boards(board, p0)) {
            for (let j = 0; j < 3; ++j) {
                if (i === j) continue;
                const p1 = piece_set[j];
                for (let { board: after_p1 } of get_next_boards(after_p0, p1)) {
                    if (count(after_p1) < count(board) + count(p0) + count(p1)) return true;
                }
            }
        }
    }
    return false;
}

function ai_make_move(game, original_piece_set) {
    const piece_set = original_piece_set.map(p => left_top_justify_piece(p));
    const board = game.board;

    const ai_move_base = ai_make_move_impl(game, piece_set);

    let result = {
        evaluation: INF_SCORE,
        new_game_states: Array(3).fill({
            board: getFull(),
            previous_piece_placement: getEmpty(),
            previous_piece: getEmpty(),
            score: game.score,
            previous_move_was_clear: false,
        })
    };
    let best_score = -1;

    for (const [p0, p1, p2] of get_all_piece_set_permutations(piece_set)) {
        for (const { placement: placement_0, board: after_p0 } of get_next_boards(board, p0)) {
            if (!ai_move_base.new_game_states.some(state => equal(state.previous_piece_placement, placement_0))) continue;
            for (const { placement: placement_1, board: after_p1 } of get_next_boards(after_p0, p1)) {
                if (!ai_move_base.new_game_states.some(state => equal(state.previous_piece_placement, placement_1))) continue;

                for (const { placement: placement_2, board: after_p2 } of get_next_boards(after_p1, p2)) {
                    if (!ai_move_base.new_game_states.some(state => equal(state.previous_piece_placement, placement_2))) continue;
                    if (!equal(ai_move_base.new_game_states[2].board, after_p2)) continue;

                    const p0_move_was_clear = count(after_p0) < count(board) + count(p0);
                    const p1_move_was_clear = count(after_p1) < count(after_p0) + count(p1);
                    const p2_move_was_clear = count(after_p2) < count(after_p1) + count(p2);
                    const score_after_p0 = game.score + get_move_score(game.previous_move_was_clear, board, placement_0, after_p0);
                    const score_after_p1 = score_after_p0 + get_move_score(p0_move_was_clear, after_p0, placement_1, after_p1);
                    const score_after_p2 = score_after_p1 + get_move_score(p1_move_was_clear, after_p1, placement_2, after_p2);

                    if (score_after_p2 < best_score) continue;
                    if (score_after_p2 === best_score && !p2_move_was_clear) continue;

                    best_score = score_after_p2;
                    result = {
                        evaluation: ai_move_base.evaluation,
                        new_game_states: [
                            {
                                board: after_p0,
                                previous_piece_placement: placement_0,
                                previous_piece: original_piece_set[piece_set.indexOf(p0)],
                                previous_move_was_clear: p0_move_was_clear,
                                score: score_after_p0,
                            },
                            {
                                board: after_p1,
                                previous_piece_placement: placement_1,
                                previous_piece: original_piece_set[piece_set.indexOf(p1)],
                                previous_move_was_clear: p1_move_was_clear,
                                score: score_after_p1,
                            },
                            {
                                board: after_p2,
                                previous_piece_placement: placement_2,
                                previous_piece: original_piece_set[piece_set.indexOf(p2)],
                                previous_move_was_clear: p2_move_was_clear,
                                score: score_after_p2,
                            },
                        ]
                    };
                }
            }
        }
    }
    return result;
}

function ai_make_move_impl(game, piece_set) {
    const board = game.board;
    const result = {
        evaluation: INF_SCORE,
        new_game_states: Array(3).fill({ board: getFull(), previous_piece_placement: getEmpty() }),
    };
    const board_count = count(board);
    let perm_index = 0;
    for (const [p0, p1, p2] of get_piece_set_permutations_optimized(board, piece_set)) {
        perm_index++;
        const p0_count = count(p0);
        const p1_count = count(p1);
        const p2_count = count(p2);

        for (const { placement: placement_0, board: after_p0 } of get_next_boards(board, p0, true)) {
            for (const { placement: placement_1, board: after_p1 } of get_next_boards(after_p0, p1, true)) {
                if (compare(p0, p1) > 0 && count(after_p1) == board_count + p0_count + p1_count) continue;
                for (const { placement: placement_2, board: after_p2 } of get_next_boards(after_p1, p2)) {
                    if (perm_index > 1 && count(after_p2) === board_count + p0_count + p1_count + p2_count) continue;
                    const score = get_eval(after_p2, result.evaluation);
                    if (score < result.evaluation) {
                        result.evaluation = score;
                        result.new_game_states = [
                            { board: after_p0, previous_piece_placement: placement_0 },
                            { board: after_p1, previous_piece_placement: placement_1 },
                            { board: after_p2, previous_piece_placement: placement_2 },
                        ];
                    }
                }
            }
        }
    }
    return result;
}

function get_new_game() {
    return {
        board: getEmpty(),
        previous_piece_placement: getEmpty(),
        previous_piece: getEmpty(),
        previous_move_was_clear: false,
        score: 0,
    };
}

function left_top_justify_piece(p) {
    if (is_empty(p)) return p;
    while (is_empty(and(p, row(0)))) p = shift_up(p);
    while (is_empty(and(p, column(0)))) p = shift_left(p);
    return p;
}

var blokie = {
    getNewGame: get_new_game,
    getEmptyPiece: getEmpty,
    getAIMove: ai_make_move,
    at: at,
    toggleSquare: (board, r, c) => xor(board, bit(r, c)),
    isEmpty: is_empty,
};

"use strict";

const N = 9, P = 5;
let board = Array.from({length:N}, () => Array(N).fill(null));
let pieces = Array.from({length:3}, () => Array.from({length:P}, () => Array(P).fill(false)));

let clearingCells = []; 
let previewTimer = null;
let pointerMode = null;
let paintValue = true;
let activePiece = -1;
let lastCellKey = "";
let currentScore = 0;

let lastState = null;

const boardBody = document.getElementById("board-body");
const pieceTables = [0,1,2].map(i => document.querySelector("#piece-on-deck-"+i+" tbody"));
const scoreEl = document.getElementById("score");
const resultEl = document.getElementById("result");
const drawBtn = document.getElementById("pause-button");
const undoBtn = document.getElementById("undo-button");
const speedEl = document.getElementById("speed");

function makeBoard() {
  boardBody.innerHTML = "";
  for (let r=0;r<N;r++) {
    const tr=document.createElement("tr");
    for (let c=0;c<N;c++) {
      const td=document.createElement("td");
      td.dataset.r=r; td.dataset.c=c;
      tr.appendChild(td);
    }
    boardBody.appendChild(tr);
  }
}
function makePieces() {
  pieceTables.forEach((tbody,pi)=>{
    tbody.innerHTML="";
    for(let r=0;r<P;r++){
      const tr=document.createElement("tr");
      for(let c=0;c<P;c++){
        const td=document.createElement("td");
        td.dataset.r=r; td.dataset.c=c; td.dataset.piece=pi;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  });
}

function renderBoard() {
  boardBody.querySelectorAll("td").forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    const val = board[r][c];

    td.classList.remove("has-piece", "color-0", "color-1", "color-2", "solution-line");

    if (clearingCells.some(x => x.r === r && x.c === c)) {
      td.classList.add("solution-line");
    } else if (val === true) {
      td.classList.add("has-piece");
    } else if (typeof val === "number") {
      td.classList.add("color-" + val);
    }
  });
  scoreEl.textContent = currentScore;
}

function renderPieces() {
  pieceTables.forEach((tbody,pi)=>{
    tbody.querySelectorAll("td").forEach(td=>{
      const r=+td.dataset.r,c=+td.dataset.c;
      td.classList.toggle("has-piece",!!pieces[pi][r][c]);
    });
  });
}

function convertBoardToDefaultColor() {
  let changed = false;
  for(let r=0;r<N;r++) {
    for(let c=0;c<N;c++) {
      if(typeof board[r][c] === "number") {
        board[r][c] = true;
        changed = true;
      }
    }
  }
  if(changed) renderBoard();
}

function saveCurrentState() {
  lastState = {
    board: board.map(row => [...row]),
    pieces: pieces.map(p => p.map(row => [...row])),
    score: currentScore
  };
}

function paintTarget(target) {
  if(pointerMode==="board"){
    const td=target.closest("#game-board td");
    if(!td)return;
    const r=+td.dataset.r,c=+td.dataset.c,key=r+","+c;
    if(key===lastCellKey)return;
    lastCellKey=key;
    board[r][c]=paintValue ? true : null;
    renderBoard(); resultEl.textContent="";
  } else if(pointerMode==="piece"){
    const td=target.closest("table.pieces-on-deck td");
    if(!td)return;
    const pi=+td.dataset.piece,r=+td.dataset.r,c=+td.dataset.c,key=pi+":"+r+","+c;
    if(pi!==activePiece || key===lastCellKey)return;
    lastCellKey=key;
    pieces[pi][r][c]=paintValue;
    renderPieces(); resultEl.textContent="";
  }
}

document.addEventListener("pointerdown",e=>{
  const boardCell=e.target.closest("#game-board td");
  const pieceCell=e.target.closest("table.pieces-on-deck td");
  if(boardCell){
    e.preventDefault();
    convertBoardToDefaultColor();
    pointerMode="board"; activePiece=-1; lastCellKey="";
    const r=+boardCell.dataset.r,c=+boardCell.dataset.c;
    paintValue=!board[r][c];
    board[r][c]=paintValue ? true : null;
    lastCellKey=r+","+c;
    renderBoard(); resultEl.textContent="";
  } else if(pieceCell){
    e.preventDefault();
    convertBoardToDefaultColor();
    pointerMode="piece"; activePiece=+pieceCell.dataset.piece; lastCellKey="";
    const pi=activePiece,r=+pieceCell.dataset.r,c=+pieceCell.dataset.c;
    paintValue=!pieces[pi][r][c];
    pieces[pi][r][c]=paintValue;
    lastCellKey=pi+":"+r+","+c;
    renderPieces(); resultEl.textContent="";
  }
});
document.addEventListener("pointermove",e=>{
  if(!pointerMode || !(e.buttons&1))return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el)paintTarget(el);
});
document.addEventListener("pointerup",()=>{pointerMode=null;activePiece=-1;lastCellKey=""});
document.addEventListener("pointercancel",()=>{pointerMode=null;activePiece=-1;lastCellKey=""});

function boardToBitboard() {
  let bb = blokie.getEmptyPiece();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) {
    if(board[r][c]) bb = blokie.toggleSquare(bb,r,c);
  }
  return bb;
}
function pieceToBitboard(piece) {
  let bb = blokie.getEmptyPiece();
  for(let r=0;r<P;r++) for(let c=0;c<P;c++) {
    if(piece[r][c]) bb = blokie.toggleSquare(bb,r,c);
  }
  return bb;
}
function bitboardToCells(bb) {
  const cells=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) {
    if(blokie.at(bb,r,c)) cells.push({r,c});
  }
  return cells;
}

function clearPiece(index) {
  for(let r=0;r<P;r++) for(let c=0;c<P;c++) {
    pieces[index][r][c] = false;
  }
}

function runOriginalAI() {
  let pieceSet = pieces.map(pieceToBitboard);
  const filledCount = pieceSet.filter(p => !blokie.isEmpty(p)).length;

  if (filledCount === 0) {
    resultEl.textContent = "도형을 하나 이상 입력해주세요.";
    return null;
  }

  const game = blokie.getNewGame();
  game.board = boardToBitboard();
  game.score = currentScore;
  game.previous_move_was_clear = false;
  game.previous_piece_placement = blokie.getEmptyPiece();
  game.previous_piece = blokie.getEmptyPiece();

  return {
    result: blokie.getAIMove(game, pieceSet),
    filledCount
  };
}

function showOriginalSolution(aiResult) {
  if(previewTimer) clearTimeout(previewTimer);

  if(!aiResult || !aiResult.result) {
    clearingCells=[];
    renderBoard();
    drawBtn.classList.remove("active");
    return;
  }

  const result = aiResult.result;
  const states = result.new_game_states || [];

  const steps = states.map(s => ({
    placementBb: s.previous_piece_placement,
    piece: s.previous_piece,
    board: s.board,
    score: s.score
  })).filter(s => !blokie.isEmpty(s.placementBb));

  if(steps.length === 0) {
    clearingCells=[];
    renderBoard();
    resultEl.textContent="현재 보드에서는 배치 가능한 위치를 찾지 못했습니다.";
    drawBtn.classList.remove("active");
    return;
  }

  const speedVal = +speedEl.value;
  const delay = 3800 - (speedVal * 360);
  let i=0;

  function processNextStep(){
    if(i>=steps.length){
      clearingCells=[];
      renderBoard();
      renderPieces();
      resultEl.textContent=`배치 완료 · ${steps.length}개 도형 배치 완료`;
      drawBtn.classList.remove("active");
      return;
    }

    const step = steps[i];
    const originalIndex = pieceSetIndexFromBitboard(step.piece, pieceSetForDisplay);
    const placedCells = bitboardToCells(step.placementBb);

    placedCells.forEach(({r, c}) => {
      board[r][c] = (originalIndex >= 0) ? originalIndex : true;
    });

    const currentBb = boardToBitboard();
    const removedBb = diff(currentBb, step.board);
    clearingCells = bitboardToCells(removedBb);

    renderBoard();

    if(originalIndex >= 0) {
      clearPiece(originalIndex);
      pieceSetForDisplay[originalIndex] = blokie.getEmptyPiece();
      renderPieces();
    }

    resultEl.textContent=`${i+1}번째 배치 진행 중...`;

    const clearDelay = clearingCells.length > 0 ? 500 : 0;

    setTimeout(() => {
      for(let r=0;r<N;r++) {
        for(let c=0;c<N;c++) {
          if(!blokie.at(step.board, r, c)) {
            board[r][c] = null;
          }
        }
      }
      clearingCells = [];
      currentScore = step.score;
      renderBoard();

      i++;
      previewTimer = setTimeout(processNextStep, Math.max(50, delay - clearDelay));
    }, clearDelay);
  }

  drawBtn.classList.add("active");
  previewTimer = setTimeout(processNextStep, 800);
}

let pieceSetForDisplay = [];
function pieceSetIndexFromBitboard(piece, set) {
  for(let i=0;i<set.length;i++) {
    if(set[i] && piece.a===set[i].a && piece.b===set[i].b && piece.c===set[i].c) return i;
  }
  return -1;
}

drawBtn.addEventListener("click",e=>{
  e.preventDefault();
  saveCurrentState();

  resultEl.textContent="계산 중... 잠시 후 배치가 시작됩니다.";
  try {
    pieceSetForDisplay=pieces.map(pieceToBitboard);
    const result=runOriginalAI();
    showOriginalSolution(result);
  } catch(err) {
    console.error(err);
    if(previewTimer)clearTimeout(previewTimer);
    drawBtn.classList.remove("active");
    resultEl.textContent="계산 중 오류가 발생했습니다. 개발자 도구를 확인해 주세요.";
  }
});

undoBtn.addEventListener("click", e => {
  e.preventDefault();
  if (!lastState) {
    resultEl.textContent = "취소할 배치 기록이 없습니다.";
    return;
  }

  if (previewTimer) clearTimeout(previewTimer);
  clearingCells = [];
  drawBtn.classList.remove("active");

  board = lastState.board.map(row => [...row]);
  pieces = lastState.pieces.map(p => p.map(row => [...row]));
  currentScore = lastState.score;

  renderBoard();
  renderPieces();

  resultEl.textContent = "방금 실행한 배치를 취소하고 이전 도형을 복원했습니다.";
});

function resetAll(){
  if(previewTimer)clearTimeout(previewTimer);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)board[r][c]=null;
  for(let p=0;p<3;p++)for(let r=0;r<P;r++)for(let c=0;c<P;c++)pieces[p][r][c]=false;
  clearingCells=[]; currentScore=0; scoreEl.textContent="0"; lastState=null;
  renderBoard(); renderPieces();
  resultEl.textContent="초기화했습니다.";
  drawBtn.classList.remove("active");
}
function showHelp(){
  alert("9×9 보드와 아래 3개의 5×5 도형을 입력하세요.\n\n• 한 칸 클릭: 선택/해제\n• 마우스 버튼을 누른 채 드래그: 여러 칸 연속 선택\n• 배치: 최적 위치를 계산하여 보드에 고유 색상으로 배치됩니다.\n• 다시보기: 직전에 수행한 배치를 취소하고 보드 및 하단 도형을 이전 상태로 복원합니다.");
}
function toggleDropdown(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle("open");
}
function toggleMobileMenu(){
  const btn=document.querySelector(".site-mobile-menu-toggle");
  if(btn)btn.classList.toggle("active");
}
document.addEventListener("click",e=>{
  document.querySelectorAll(".site-nav-dropdown-content.open").forEach(x=>{
    if(!x.closest(".site-nav-dropdown").contains(e.target))x.classList.remove("open");
  });
});

makeBoard(); makePieces(); renderBoard(); renderPieces();

</script>
